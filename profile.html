<!DOCTYPE html>
<html>
<head>
  <title>Profile - Barnoota Live</title>

  <style>
    body{
      margin:0;
      background:#1c1c1c;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }
    img{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      margin-top:20px;
    }
    input{
      margin:10px;
      padding:8px;
      border-radius:6px;
      border:none;
    }
    button{
      padding:10px 15px;
      border:none;
      border-radius:6px;
      background:red;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h2>👤 Profile</h2>

<img id="profilePic" src="https://via.placeholder.com/120">

<p id="email"></p>
<h2 id="profileName">Loading...</h2>
<p id="profileEmail"></p>

<button id="followBtn" onclick="toggleFollow()">Follow</button>

<p>
Followers: <span id="followersCount">0</span> |
Following: <span id="followingCount">0</span>
</p>
<input type="text" id="nameInput" placeholder="Maqaa kee">
<br>
<input type="file" id="imgInput">
<br>
<button onclick="saveProfile()">Save Profile</button>
<button onclick="followUser()">Follow</button>
<div>Followers: <span id="followerCount">0</span></div>
  <!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig={
  apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
  authDomain:"abseapp-b3706.firebaseapp.com",
  projectId:"abseapp-b3706",
  storageBucket:"abseapp-b3706.firebasestorage.app",
  messagingSenderId:"986026055368",
  appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
  const userEmail = localStorage.getItem("userEmail");
  document.getElementById("email").innerText = userEmail;

  const savedName = localStorage.getItem("profileName");
  const savedImg = localStorage.getItem("profileImg");

  if(savedName) document.getElementById("nameInput").value = savedName;
  if(savedImg) document.getElementById("profilePic").src = savedImg;

  document.getElementById("imgInput").addEventListener("change", function(){
    const file = this.files[0];
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById("profilePic").src = e.target.result;
      localStorage.setItem("profileImg", e.target.result);
    };
    reader.readAsDataURL(file);
  });

  function saveProfile(){
    const name = document.getElementById("nameInput").value;
    localStorage.setItem("profileName", name);
    alert("Profile saved!");
  }const profileName = localStorage.getItem("profileName") || "User";

// follower count jalqabaa
let followers = parseInt(localStorage.getItem("followers_"+profileName)) || 0;
document.getElementById("followerCount").innerText = followers;

function followUser(){
  followers++;
  localStorage.setItem("followers_"+profileName, followers);
  document.getElementById("followerCount").innerText = followers;

  // follow list keessatti galcha
  let following = JSON.parse(localStorage.getItem("followingList")) || [];
  if(!following.includes(profileName)){
    following.push(profileName);
    localStorage.setItem("followingList", JSON.stringify(following));
  }

  alert("Follow godhe ✔");
  }
</script>

</body>
</html>
