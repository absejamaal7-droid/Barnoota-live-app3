<!DOCTYPE html>
<html>
<head>
<title>Barnoota Live - Chat + Posts + Calls</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://meet.jit.si/external_api.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
<script src="app.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;transition:all 0.3s;}
body.light{background:#f5f5f5;color:black;}
.topbar{display:flex;justify-content:space-between;background:#1877f2;color:white;padding:10px;flex-wrap:wrap;}
.topbar span{margin-right:10px;cursor:pointer;font-size:18px;}
.dropdown{display:none;position:absolute;right:10px;background:white;color:black;padding:10px;border-radius:6px;}
.side-menu{display:none;position:fixed;left:10px;bottom:70px;background:white;color:black;width:200px;padding:10px;border-radius:8px;}
.learning-btn{position:fixed;bottom:10px;left:10px;background:#1877f2;color:white;border:none;padding:12px;border-radius:50%;font-size:20px;cursor:pointer;}
.show{display:block;}
#content{padding:10px;}
.post{background:#1e293b;padding:10px;margin-top:10px;border-radius:12px;}
textarea{width:100%;padding:8px;border-radius:8px;border:none;margin-top:8px;}
.feedVideo{width:100%;margin-top:10px;border-radius:8px;}
button{cursor:pointer;border:none;border-radius:6px;padding:6px 10px;background:#1877f2;color:white;}

/* Chat UI */
#chatBox{position:fixed;bottom:0;right:0;width:100%;max-width:400px;height:500px;background:#111b2b;color:white;display:none;flex-direction:column;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.5);}
#chatBoxHeader{background:#1877f2;color:white;padding:10px;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0;}
#chatMessages{flex:1;overflow:auto;padding:10px;background:#0a1a2a;scroll-behavior:smooth;}
.message{padding:8px 12px;margin:4px 0;border-radius:20px;max-width:80%;display:inline-block;word-wrap:break-word;position:relative;transition:all 0.2s;}
.message.sent{background:#2a9d8f;margin-left:auto;color:white;}
.message.received{background:#e5e5e5;margin-right:auto;color:black;}
.message .reaction{position:absolute;bottom:-5px;right:-5px;font-size:12px;cursor:pointer;}
.message.seen::after{content:'✓';font-size:12px;position:absolute;bottom:2px;right:5px;color:lime;}
.message.typing::after{content:'...';animation:blink 1s infinite;}
@keyframes blink{0%,50%,100%{opacity:1;}25%,75%{opacity:0;}}
#chatInputSection{display:flex;padding:5px;background:#192b3a;border-radius:0 0 12px 12px;}
#chatInput{flex:1;border:none;padding:10px;border-radius:20px;margin-right:5px;background:white;color:black;}
.emojiPicker{display:none;background:#0a1a2a;padding:5px;border-radius:8px;margin-bottom:5px;overflow-x:auto;white-space:nowrap;}
.emojiPicker span{cursor:pointer;margin:3px;font-size:18px;}
.reactionsPopup{display:none;position:absolute;background:#192b3a;padding:5px;border-radius:8px;box-shadow:0 0 5px black;white-space:nowrap;z-index:100;}
.reactionsPopup span{cursor:pointer;margin:3px;font-size:18px;}
#themeToggle{position:fixed;bottom:10px;right:10px;background:#1877f2;padding:8px;border-radius:50%;font-size:18px;cursor:pointer;}
</style>
</head>
<body>
<!-- Top Bar -->
<div class="topbar">
  <div>
    <span onclick="goHome()">🏠</span>
    <span onclick="alert('Video coming soon')">🖥</span>
    <span onclick="openAddFriends()">🫂</span>
    <span onclick="alert('Notification coming soon')">☎️</span>
    <span onclick="alert('Story coming soon')">👜</span>
    <span onclick="goProfile()">👤</span>
  </div>
  <div>
    <span onclick="alert('Search coming soon')">🔍</span>
    <span onclick="toggleAdd()">➕</span>
  </div>
</div>

<!-- Add Menu -->
<div id="addMenu" class="dropdown">
  <p onclick="document.getElementById('postText').focus()">Post</p>
  <p onclick="alert('Write coming soon')">🖋</p>
  <p onclick="alert('Reel coming soon')">Reel</p>
  <p onclick="openStoryUpload()">Story</p>
  <p onclick="alert('Note coming soon')">Note</p>
  <p onclick="showLiveSection()">Live</p>
  </div>
</div>
  
<!-- Learning Menu -->
<button class="learning-btn" onclick="toggleLearning()">📚</button>
<div id="learningMenu" class="side-menu">
  <p onclick="alert('Meet coming soon')">Meet</p>
  <p onclick="alert('Join coming soon')">Join</p>
  <p onclick="alert('Share coming soon')">Share</p>
  <p onclick="alert('Schedule coming soon')">Schedule</p>
  <p onclick="alert('Team Chat coming soon')">Team Chat</p>
  </div>
</div>
  
<!-- Add Friends Box -->
<div id="addFriendsBox" style="display:none;background:#1e293b;padding:10px;border-radius:12px;margin:10px;">
  <h3>Add Friend</h3>
  <input id="friendEmail" placeholder="Friend email galchi" style="padding:8px;width:100%;border-radius:6px;border:none;">
  <br><br>
  <button onclick="sendFriendRequest()">Send Request</button>
  <div id="friendResult"></div>
</div>
</div>
  
<!-- logout -->
  <div id="logout">
    <button onclick="logout()">logout</button>
  </div>
</div>
  
  <!-- post -->
<div id="content">
  <h3>Post haaraa</h3>
  <textarea id="postText" placeholder="Waan yaadde barreessi..."></textarea>
  <input type="file" id="videoFile" accept="video/*">
  <button onclick="addPost()">Post godhi</button>
  <div id="posts">
  </div>
</div>

<h3>Post koo</h3>

<button onclick="addComment()">💬 Comment</button>

<div id="comments"></div>

  <input id="commentInput" placeholder="Yaada kee barreessi">
<button onclick="addComment()">Send</button>
<!-- Story Section -->
<div id="storySection" style="display:flex;overflow-x:auto;padding:10px;background:#111b2b;border-radius:10px;margin-bottom:10px;">
  <div style="text-align:center;margin-right:10px;">
    <label style="cursor:pointer;">
      <div style="width:60px;height:60px;border-radius:50%;background:#1877f2;display:flex;align-items:center;justify-content:center;font-size:24px;">+</div>
      <input type="file" id="storyFile" accept="image/*,video/*" style="display:none" onchange="uploadStory()">
    </label>
    <small>Add Story</small>
  <div id="stories"></div>
  </div>
</div>

<!-- Story Upload Popup -->
<div id="storyUploadBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;">
<div style="background:#1e293b;padding:20px;border-radius:10px;width:300px;text-align:center;">
<h3>Upload Story</h3>
<input type="file" id="storyFile2" accept="image/*,video/*">
<br><br>
<button onclick="uploadStoryFromMenu()">Upload</button>
<button onclick="closeStoryUpload()" style="background:red;">Cancel</button>
</div>
</div>

<!-- Live Section -->
<div id="liveSection" style="margin-top:20px;">
  <h3>Live Broadcasting</h3>
  <video id="liveVideo" width="100%" height="300" controls autoplay muted></video>
  <br>
  <button id="startLiveBtn">Start Live</button>
  <button id="stopLiveBtn">Stop Live</button>
</div>
  </div>
  
<!-- Chat Box -->
<div id="chatBox">
  <div id="chatBoxHeader">
    <span id="chatUser">Live Chat</span>
    <button onclick="closeChat()">❌</button>
    </div>
  <div id="chatMessages"></div>
  <div id="chatInputSection">
    <input id="chatInput" placeholder="Message...">
    <button onclick="sendChat()">Send</button>
  </div>
</div>
<!-- Theme Toggle -->
<button id="themeToggle" onclick="toggleTheme()">🌓</button>
  </div>
</div>
  
<script>
// Firebase
const firebaseConfig = {
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",
projectId:"abseapp-b3706",
storageBucket:"abseapp-b3706.appspot.com",
messagingSenderId:"986026055368",
appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), storage = firebase.storage();
let currentUser = null;

// Auth
auth.onAuthStateChanged(user=>{
  if(!user) window.location.href="index.html";
  currentUser=user;
  loadPosts();
  loadStories();
});

// Navigation
function goHome(){window.location.href="home.html";}
function goProfile(){window.location.href="profile.html";}
function toggleAdd(){document.getElementById("addMenu").classList.toggle("show");}
function toggleLearning(){document.getElementById("learningMenu").classList.toggle("show");}
function toggleTheme(){document.body.classList.toggle("light");}

// Story
function uploadStory(){
  const file=document.getElementById("storyFile").files[0];
  if(!file) return;
  const ref=storage.ref().child("stories/"+Date.now()+file.name);
  ref.put(file).then(()=>ref.getDownloadURL().then(url=>{
    db.collection("stories").add({user:currentUser.email,url:url,type:file.type,date:new Date()});
    alert("Story uploaded ✔");
  }));
}
function openStoryUpload(){document.getElementById("storyUploadBox").style.display="flex";}
function closeStoryUpload(){document.getElementById("storyUploadBox").style.display="none";}
function uploadStoryFromMenu(){
  const file=document.getElementById("storyFile2").files[0];
  if(!file) return alert("File filadhu");
  const ref=storage.ref().child("stories/"+Date.now()+file.name);
  ref.put(file).then(()=>ref.getDownloadURL().then(url=>{
    db.collection("stories").add({user:currentUser.email,url:url,type:file.type,date:new Date()});
    alert("Story uploaded ✔");
    document.getElementById("storyUploadBox").style.display="none";
    closeStoryUpload();
  }));
}
  function addComment(){

  const input = document.getElementById("commentInput");
  const text = input.value;

  if(text === "") return;

  db.collection("comments").add({
    text: text,
    user: auth.currentUser.Email,
    date: new Date()
  });

  input.value = "";
  }
  db.collection("comments").orderBy("date","desc")
.onSnapshot(snapshot => {

  const box = document.getElementById("comments");
  box.innerHTML = "";

  snapshot.forEach(doc => {

    const c = doc.data();

    const div = document.createElement("div");
    div.style.border = "1px solid gray";
    div.style.margin = "5px";
    div.style.padding = "5px";

    div.innerHTML = `
      <p><b>${c.user}</b>: ${c.text}</p>
  <button onclick="likeComment('${doc.id}')">❤️ Like</button>
    <span id="like-${doc.id}">0</span>
  <button onclick="replyComment('${doc.id}')">↩️ Reply</button>
<div id="reply-${doc.id}"></div>
  <button onclick="deleteComment('${doc.id}', '${c.user}')">🗑 Delete</button>
<button onclick="editComment('${doc.id}', '${c.text}', '${c.user}')">✏️ Edit</button>

    `;

    box.appendChild(div);

    loadLikes(doc.id);
    loadReplies(doc.id);
  });

});
  function likeComment(commentId){

  db.collection("comments")
    .doc(commentId)
    .collection("likes")
    .doc(auth.currentUser.uid)
    .set({
      user: auth.currentUser.Email
    });
  }function loadLikes(commentId){

  db.collection("comments")
    .doc(commentId)
    .collection("likes")
    .onSnapshot(snapshot => {

      const el = document.getElementById("like-" + commentId);
      if(el){
        el.innerText = snapshot.size;
      }

    });
    }
  function replyComment(commentId){

  const text = prompt("Reply kee barreessi:");
  if(!text) return;

  db.collection("comments")
    .doc(commentId)
    .collection("replies")
    .add({
      text: text,
      user: auth.currentUser.Email,
      date: new Date()
    });
                }function reply(btn){

  const text = prompt("Reply kee barreessi:");

  if(!text) return;

  const replyDiv = document.createElement("p");
  replyDiv.style.marginLeft = "20px";
  replyDiv.innerText = text;

  btn.nextElementSibling.appendChild(replyDiv);
  }function like(btn){
  const span = btn.nextElementSibling;
  let count = parseInt(span.innerText);

  span.innerText = count + 1;
  }
  function loadReplies(commentId){

  db.collection("comments")
    .doc(commentId)
    .collection("replies")
    .orderBy("date")
    .onSnapshot(snapshot => {

      const box = document.getElementById("reply-" + commentId);
      box.innerHTML = "";

      snapshot.forEach(doc => {
        const r = doc.data();

        const p = document.createElement("p");
        p.style.marginLeft = "20px";
        p.innerText = r.user + ": " + r.text;

        box.appendChild(p);
      });

    });
                       }function deleteComment(commentId, ownerEmail){

  if(auth.currentUser.Email !== ownerEmail){
    alert("Kan kee qofa delete gochuu dandeessa!");
    return;
  }

  db.collection("comments")
    .doc(commentId)
    .delete();
  }function editComment(commentId, oldText, ownerEmail){

  if(auth.currentUser.Email !== ownerEmail){
    alert("Kan kee qofa edit gochuu dandeessa!");
    return;
  }

  const newText = prompt("Edit:", oldText);
  if(!newText) return;

  db.collection("comments")
    .doc(commentId)
    .update({
      text: newText
    });
  }
function loadStories(){
  db.collection("stories").orderBy("date","desc").onSnapshot(snapshot=>{
    const container=document.getElementById("stories");
    container.innerHTML="";
    snapshot.forEach(doc=>{
      const s=doc.data();
      const div=document.createElement("div");
      div.style.marginRight="10px"; div.style.cursor="pointer"; div.style.textAlign="center";
      div.innerHTML=`<div style="width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #1877f2;">${s.type.startsWith("video")?`<video src="${s.url}" style="width:100%;height:100%;object-fit:cover;"></video>`:`<img src="${s.url}" style="width:100%;height:100%;object-fit:cover;">`}</div><small>${s.user.split("@")[0]}</small>`;
      div.onclick=()=>alert("Story view coming soon");
      container.appendChild(div);
    });
  });
}

// Posts
function addPost(){
  const text=document.getElementById("postText").value;
  const file=document.getElementById("videoFile").files[0];
  if(!text&&!file) return alert("Text ykn video galchi!");
  if(!file){
    db.collection("posts").add({text,user:currentUser.user,date:new Date()});
    document.getElementById("postText").value="";
    return;
  }
  const ref=storage.ref().child("videos/"+Date.now()+file.name);
  ref.put(file).then(()=>ref.getDownloadURL().then(url=>{
    db.collection("posts").add({text,user:currentUser.Email,videoURL:url,date:new Date()});
    document.getElementById("postText").value="";
    document.getElementById("videoFile").value="";
  }));
}
function loadPosts(){
  db.collection("posts").orderBy("date","desc").onSnapshot(snap=>{
    const container=document.getElementById("posts");
    container.innerHTML="";
    snap.forEach(doc=>{
      const d=doc.data();
      const div=document.createElement("div");
      div.className="post";
      div.innerHTML=`<h4>${d.user}</h4><p>${d.text||""}</p>${d.videoURL?`<video class="feedVideo" src="${d.videoURL}" controls></video>`:""}`;
      container.appendChild(div);
    });
  });
}

  function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
  }
// Chat
function openChat(user){document.getElementById("chatBox").style.display="flex";}
function closeChat(){document.getElementById("chatBox").style.display="none";}
function sendChat(){
  const text=document.getElementById("chatInput").value;
  if(!text) return;
  db.collection("liveChat").add({user:currentUser.Email,text,date:new Date()});
  document.getElementById("chatInput").value="";
}
db.collection("liveChat").orderBy("date").onSnapshot(snapshot=>{
  const box=document.getElementById("chatMessages");
  box.innerHTML="";
  snapshot.forEach(doc=>{
    const m=doc.data();
    const p=document.createElement("p");
    p.textContent=`${m.user}: ${m.text}`;
    box.appendChild(p);
    box.scrollTop = box.scrollHeight;
  });
}function showLiveSection(){
  document.getElementById("liveSection").scrollIntoView({behavior:"smooth"});
}

// Friend
function openAddFriends(){const box=document.getElementById("addFriendsBox");box.style.display=(box.style.display==="none")?"block":"none";}
function sendFriendRequest(){
  const email=document.getElementById("friendEmail").value;
  if(!email) return alert("Email galchi");
  db.collection("friendRequests").add({from:currentUser.email,to:email,status:"pending",date:new Date()}).then(()=>{
    document.getElementById("friendResult").innerText="Request sent ✔";
    document.getElementById("friendEmail").value="";
  });
}
</script>
</body>
</html>
