<div id="content">
<h3>Post haaraa</h3>
<textarea id="postText" placeholder="Waan yaadde barreessi..."></textarea>
<input type="file" id="videoFile" accept="video/*">
<button onclick="addPost()">Post godhi</button>
<div id="posts()">Poss"></div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",
projectId:"abseapp-b3706",
storageBucket:"abseapp-b3706.firebasestorage.app",
messagingSenderId:"986026055368",
appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();
let currentUser=null;

auth.onAuthStateChanged(user=>{
if(!user) window.location.href="index.html";
currentUser=user;
loadPosts();
});

function goHome(){window.location.href="home.html";}
function goProfile(){window.location.href="profile.html";}
function goMeet(){window.location.href="liveclass.html";}
function logout(){auth.signOut().then(()=>window.location.href="index.html");}

function toggleAdd(){
document.getElementById("addMenu").classList.toggle("show");
}

function toggleLearning(){
document.getElementById("learningMenu").classList.toggle("show");
}

function addPost(){
const text=document.getElementById("postText").value;
const file=document.getElementById("videoFile").files[0];
if(!text && !file) return alert("Text ykn video galchi!");

if(!file){
db.collection("posts").add({
text,user:currentUser.email,date:new Date()
});
document.getElementById("postText").value="";
return;
}

const ref=storage.ref().child("videos/"+Date.now()+file.name);
ref.put(file).then(()=>{
ref.getDownloadURL().then(url=>{
db.collection("posts").add({
text,user:currentUser.email,videoURL:url,date:new Date()
});
document.getElementById("postText").value="";
document.getElementById("videoFile").value="";
});
});
}

function loadPosts(){
db.collection("posts").orderBy("date","desc").onSnapshot(snap=>{
const container=document.getElementById("posts");
container.innerHTML="";
snap.forEach(doc=>{
const d=doc.data();
const div=document.createElement("div");
div.className="post";
div.innerHTML=`
<h4>${d.user}</h4>
<p>${d.text||""}</p>
${d.videoURL?`<video class="feedVideo" src="${d.videoURL}" controls></video>`:""}
`;
container.appendChild(div);
});
});
}

let api=null;
function startMeet(){
const roomName="BarnootaLive_"+Date.now();
document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
api=new JitsiMeetExternalAPI("meet.jit.si",{roomName,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
}

function joinMeet(){
const room=prompt("Room code galchi:");
if(!room) return;
document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
}
</script>
