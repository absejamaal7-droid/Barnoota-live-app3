<script>
const firebaseConfig={
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",
projectId:"abseapp-b3706",
storageBucket:"abseapp-b3706.firebasestorage.app",
messagingSenderId:"986026055368",
appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();
let currentUser=null;

auth.onAuthStateChanged(user=>{
if(!user) window.location.href="index.html";
currentUser=user;
loadPosts();
});

function goHome(){window.location.href="home.html";}
function goProfile(){window.location.href="profile.html";}
function goMeet(){window.location.href="liveclass.html";}
function logout(){auth.signOut().then(()=>window.location.href="index.html");}

function toggleAdd(){
document.getElementById("addMenu").classList.toggle("show");
}

function toggleLearning(){
document.getElementById("learningMenu").classList.toggle("show");
}

function addPost(){
const text=document.getElementById("postText").value;
const file=document.getElementById("videoFile").files[value];
if(!text && !file) return alert("Text ykn video galchi!");

if(!file){
db.collection("posts").add({
text,user:currentUser.email,date:new Date()
});
document.getElementById("postText").value="";
return;
}

const ref=storage.ref().child("videos/"+Date.now()+file.name);
ref.put(file).then(()=>{
ref.getDownloadURL().then(url=>{
db.collection("posts").add({
text,user:currentUser.email,videoURL:url,date:new Date()
});
document.getElementById("postText").value="";
document.getElementById("videoFile").value="";
});
});
}

function loadPosts(){
db.collection("posts").orderBy("date","desc").onSnapshot(snap=>{
const container=document.getElementById("posts");
container.innerHTML="";
snap.forEach(doc=>{
const d=doc.data();
const div=document.createElement("div");
div.className="post";
  updateLikeCount(doc.id);db.collection("posts")
.doc(doc.id)
.collection("comments")
.orderBy("date")
.onSnapshot(snap=>{

const area = document.getElementById("c-"+doc.id);

area.innerHTML="";

snap.forEach(c=>{

const p=document.createElement("p");

p.textContent=c.data().user+" : "+c.data().text;

area.appendChild(p);

});

});
div.innerHTML=`<button onclick="sharePost('${doc.id}')">🔗 Share</button><button onclick="commentPost('${doc.id}')">💬 Comment</button>
<div id="c-${doc.id}"></div><button onclick="toggleLike('${doc.id}')">❤️ Like</button>
<span id="like-${doc.id}">❤️ 0</span>
<h4>${d.user}</h4>
<p>${d.text||""}</p>
${d.videoURL?`<video class="feedVideo" src="${d.videoURL}" controls></video>`:""}
`;
container.appendChild(div);updateLikeCount(doc.id);
});
});
}

let api=null;
function startMeet(){
const roomName="BarnootaLive_"+Date.now();
document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
api=new JitsiMeetExternalAPI("meet.jit.si",{roomName,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
}function sharePost(postId){

db.collection("posts")
.doc(postId)
.get()
.then(doc=>{

if(!doc.exists) return;

const data=doc.data();

let text="Barnoota Live Post\n\n";

text+=data.userName+"\n";

text+=data.text+"\n";

if(data.videoURL){
text+=data.videoURL;
}

navigator.clipboard.writeText(text);

alert("Post copy godhame");

});function toggleLike(postId){

const likeRef = db.collection("posts")
.doc(postId)
.collection("likes")
.doc(currentUser.uid);

likeRef.get().then(doc=>{

if(doc.exists){
likeRef.delete();
}else{
likeRef.set({
userUid:currentUser.uid,
date:new Date()
});
}

});

  }
  function updateLikeCount(postId){

db.collection("posts")
.doc(postId)
.collection("likes")
.onSnapshot(snapshot=>{

const el = document.getElementById("like-"+postId);

if(el){
el.innerText="❤️ "+snapshot.size;
}

});

  }
  function commentPost(postId){

const text = prompt("Comment kee barreessi:");

if(!text) return;

db.collection("posts")
.doc(postId)
.collection("comments")
.add({

text:text,
user:currentUser.email,
date:new Date()

});

}

                                      }

function joinMeet(){
const room=prompt("Room code galchi:");
if(!room) return;
document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
}
  function goMeet(){ window.location.href="liveclass.html"; }
</script>
