<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <title>Absee App - Home</title>

  <style>
    body {
      font-family: Arial;
      background: #f1f1f1;
      margin: 0;
    }

    header {
      background: #2196f3;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    .feed {
      padding: 15px;
    }

    .post {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px gray;
    }

    .btn {
      background: #4caf50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      width: 100%;
      margin-top: 10px;
    }

    .timer {
      background: black;
      color: red;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  Absee Classroom App
</header>

<div class="timer" id="timer">
  Free Trial: 60:00
</div>

<div class="feed">

  <div class="post">
    <h3>Barnoota Har’aa</h3>
    <p>Welcome gara classroom keenyaatti.</p>
    <button class="btn" onclick="goJoin()">Join Class</button>
  </div>

  <div class="post">
    <h3>Odeeffannoo</h3>
    <p>Free trial daqiiqa 60 qofa.</p>
  </div>

</div>

<script>
let time = 60 * 60; // 60 daqiiqa

function startTimer() {
  setInterval(function() {
    let min = Math.floor(time / 60);
    let sec = time % 60;

    document.getElementById("timer").innerHTML =
      "Free Trial: " + min + ":" + (sec < 10 ? "0" : "") + sec;

    time--;

    if(time < 0) {
      alert("Yeroon kee dhumate. Mee join haarawaa godhi.");
      window.location.href = "join.html";
    }
  }, 1000);
}

startTimer();

function goJoin() {
  window.location.href = "join.html";
}
</script>

</body>
</html>
