<!DOCTYPE html>
<html>
<head>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.topbar{display:flex;justify-content:space-between;background:#1877f2;color:white;padding:10px;}
.topbar span{margin-right:15px;cursor:pointer;}

.learning-btn{position:fixed;bottom:10px;left:10px;background:#1877f2;color:white;border:none;padding:12px;border-radius:50%;font-size:20px;cursor:pointer;}

.post{background:#1e293b;padding:12px;margin-top:10px;border-radius:8px;}

.feedVideo{width:100%;margin-top:10px;border-radius:6px;}

</style>
</head>

<body>

<div class="topbar">
<div>
<span onclick="goHome()">🏠</span>

</div>

<div>
<span onclick="alert('Search coming soon')">🔍</span>

</div>
</div>

<div id="addMenu" class="dropdown">
<p onclick="document.getElementById('postText').focus()">Post</p>
<p onclick="alert('Write coming soon')">🖋</p>
<p onclick="alert('Reel coming soon')">Reel</p>
<p onclick="alert('Story coming soon')">Story</p>
<p onclick="alert('Note coming soon')">Note</p>
</div>

<button class="learning-btn" onclick="toggleLearning()">📚</button>

<div id="learningMenu" class="side-menu">
<p onclick="startMeet()">Meet</p>
<p onclick="joinMeet()">Join</p>
<p onclick="alert('Share coming soon')">Share</p>
<p onclick="alert('Schedule coming soon')">Schedule</p>
<p onclick="alert('Team Chat coming soon')">Team Chat</p>

<p onclick="alert('Events coming soon')">Events</p>
<p onclick="alert('Apps coming soon')">Apps</p>
</div>

<div id="content">
<h3>Post haaraa</h3>
<textarea id="postText" placeholder="Waan yaadde barreessi..."></textarea>
<input type="file" id="videoFile" accept="video/*">
<button onclick="addPost()">Post godhi</button>
<div id="posts"></div>
  <div id="addFriendsBox" style="display:none;background:#1e293b;padding:15px;border-radius:10px;margin-top:10px;">

<h3>Add Friend</h3>

<input id="friendEmail" placeholder="Friend email galchi" style="padding:8px;width:100%;border-radius:6px;border:none;">

<br><br>

<button onclick="sendFriendRequest()">Send Request</button>

<div id="friendResult"></div>

  </div>
</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",
projectId:"abseapp-b3706",
storageBucket:"abseapp-b3706.firebasestorage.app",
messagingSenderId:"986026055368",
appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

let currentUser=null;

auth.onAuthStateChanged(user=>{
if(!user) window.location.href="index.html";
currentUser=user;
loadPosts();
  checkFriendRequests();
});

function goHome(){window.location.href="home.html";}
function goProfile(){window.location.href="profile.html";}

function toggleAdd(){
document.getElementById("addMenu").classList.toggle("show");
}

function toggleLearning(){
document.getElementById("learningMenu").classList.toggle("show");
}

function addPost(){

const text=document.getElementById("postText").value;
const file=document.getElementById("videoFile").files[0];

if(!text && !file) return alert("Text ykn video galchi!");

if(!file){

db.collection("posts").add({
text:text,
user:currentUser.email,
date:new Date()
});

document.getElementById("postText").value="";
return;

}
  function checkFriendRequests(){

db.collection("friendRequests")
.where("toUid","==",currentUser.uid)
.where("status","==","pending")
.onSnapshot(snapshot=>{

snapshot.forEach(doc=>{

const data = doc.data();

if(confirm("Friend request haaraa jira. Accept goota?")){

db.collection("friendRequests")
.doc(doc.id)
.update({status:"accepted"});

}

});

});

  }

const ref=storage.ref().child("videos/"+Date.now()+file.name);

ref.put(file).then(()=>{

ref.getDownloadURL().then(url=>{

db.collection("posts").add({
text:text,
user:currentUser.email,
videoURL:url,
date:new Date()
});

document.getElementById("postText").value="";
document.getElementById("videoFile").value="";

});

});

}

function loadPosts(){

db.collection("posts")
.orderBy("date","desc")
.onSnapshot(snap=>{

const container=document.getElementById("posts");
container.innerHTML="";

snap.forEach(doc=>{

const d=doc.data();
const div=document.createElement("div");
div.className="post";

div.innerHTML=`

<button onclick="sharePost('${doc.id}')">🔗 Share</button>

<button onclick="sendFriendRequest('${data.userUid}')">🫂 Add Friend</button>

<button onclick="commentPost('${doc.id}')">💬 Comment</button>

<div id="c-${doc.id}"></div>

<button onclick="toggleLike('${doc.id}')">❤️ Like</button>

<span id="like-${doc.id}">❤️ 0</span>

<h4>${d.user}</h4>

<p>${d.text||""}</p>

${d.videoURL?`<video class="feedVideo" src="${d.videoURL}" controls></video>`:""}

`;

container.appendChild(div);

updateLikeCount(doc.id);

db.collection("posts")
.doc(doc.id)
.collection("comments")
.orderBy("date")
.onSnapshot(snap=>{

const area=document.getElementById("c-"+doc.id);
area.innerHTML="";

snap.forEach(c=>{

const p=document.createElement("p");

p.textContent=c.data().user+" : "+c.data().text;

area.appendChild(p);

});

});

});

});

}

function toggleLike(postId){

const likeRef=db.collection("posts")
.doc(postId)
.collection("likes")
.doc(currentUser.uid);

likeRef.get().then(doc=>{

if(doc.exists){
likeRef.delete();
}else{
likeRef.set({
userUid:currentUser.uid,
date:new Date()
});
}

});

}

function updateLikeCount(postId){

db.collection("posts")
.doc(postId)
.collection("likes")
.onSnapshot(snapshot=>{

const el=document.getElementById("like-"+postId);

if(el){
el.innerText="❤️ "+snapshot.size;
}

});

}

function commentPost(postId){

const text=prompt("Comment kee barreessi:");

if(!text) return;

db.collection("posts")
.doc(postId)
.collection("comments")
.add({

text:text,
user:currentUser.email,
date:new Date()

});

}

function sharePost(postId){

db.collection("posts")
.doc(postId)
.get()
.then(doc=>{

if(!doc.exists) return;

const data=doc.data();

let text="Barnoota Live Post\n\n";

text+=data.user+"\n";

text+=data.text+"\n";

if(data.videoURL){
text+=data.videoURL;
}

navigator.clipboard.writeText(text);

alert("Post copy godhame");

});

}
  function sendFriendRequest(toUid){

if(toUid === currentUser.uid){
alert("Ofitti request hin ergu!");
return;
}

db.collection("friendRequests").add({

fromUid: currentUser.uid,
toUid: toUid,
status: "pending",
date: new Date()

})
.then(()=>{

alert("Friend request ergame");

});

  }

let api=null;

function startMeet(){

const roomName="BarnootaLive_"+Date.now();

document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;

api=new JitsiMeetExternalAPI("meet.jit.si",{
roomName:roomName,
parentNode:document.querySelector("#meet"),
width:"100%",
height:"100%"
});

}

function joinMeet(){

const room=prompt("Room code galchi:");

if(!room) return;

document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;

api=new JitsiMeetExternalAPI("meet.jit.si",{
roomName:room,
parentNode:document.querySelector("#meet"),
width:"100%",
height:"100%"
});

}
  function sendFriendRequest(){

const email=document.getElementById("friendEmail").value;

if(!email) return alert("Email galchi");

db.collection("friendRequests").add({

from:currentUser.email,
to:email,
status:"pending",
date:new Date()

}).then(()=>{

document.getElementById("friendResult").innerText="Request sent ✔";
document.getElementById("friendEmail").value="";

});

  }
function openAddFriends(){
const box=document.getElementById("addFriendsBox");

if(box.style.display==="none"){
box.style.display="block";
}else{
box.style.display="none";
}
  }
  
</script>

</body>
</html>
