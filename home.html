<!DOCTYPE html>
<html>
<head>
  <title>Home - Live Class</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1c1c1c;
      color: white;
    }

    #topbar {
      background: #2d2d2d;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #menu button {
      margin-right: 8px;
      background: #444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
    }

    #menu button:hover {
      background: #666;
    }

    #profile {
      background: #0084ff;
      padding: 8px 12px;
      border-radius: 6px;
    }

    #content {
      padding: 30px;
      text-align: center;
    }

    .big-btn {
      display: block;
      margin: 10px auto;
      width: 220px;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      color: white;
      background: #0084ff;
    }
  </style>
</head>

<body>

<div id="topbar">
  <div id="menu">
    <button onclick="createMeet()">Meet</button>
    <button onclick="joinMeet()">Join</button>
    <button onclick="scheduleMeet()">Schedule</button>
    <button onclick="shareApp()">Share</button>
    <button onclick="openSettings()">Setting</button>
  </div>

  <div id="profile">
    👤 My Profile
  </div>
</div>

<div id="content">
  <h2>Welcome to Live Classroom</h2>

  <button class="big-btn" onclick="createMeet()">Create Meeting</button>
  <button class="big-btn" onclick="joinMeet()">Join Meeting</button>
</div>

<script>
  function createMeet() {
    const room = "room-" + Math.floor(Math.random() * 100000);
    window.location.href = "live.html?room=" + room;
  }

  function joinMeet() {
    const room = prompt("Meeting ID galchi");
    if (room) {
      window.location.href = "live.html?room=" + room;
    }
  }

  function scheduleMeet() {
    alert("Schedule fuulduratti dabalama");
  }

  function shareApp() {
    alert("Link app kee share godhi");
  }

  function openSettings() {
    alert("Settings fuulduratti dabalama");
  }
</script>

</body>
</html>
