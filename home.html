<!DOCTYPE html>
<html>
<head>
<title>Barnoota Live - Home</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://meet.jit.si/external_api.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
#topbar{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;}
#menu{display:flex;gap:8px;flex-wrap:wrap;padding:10px;}
button{background:#2563eb;border:none;color:white;padding:8px 12px;border-radius:6px;cursor:pointer;}
#content{padding:15px;padding-bottom:80px;}
.post{background:#1e293b;padding:12px;margin-top:10px;border-radius:8px;}
textarea{width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px;}
#bottomNav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#111827;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #333;}
#bottomNav button{background:none;border:none;color:white;font-size:14px;}
.feedVideo{width:100%;margin-top:10px;border-radius:6px;}
</style>
</head>

<body>

<div id="topbar">
  <div>Barnoota Live</div>
  <div id="userEmail">Loading...</div>
</div>

<div id="menu">
  <button onclick="goProfile()">👤 Profile</button>
  <button onclick="startMeet()">🎥 Meet</button>
  <button onclick="joinMeet()">Join Meet</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div id="content">
  <h3>Post haaraa</h3>
  <textarea id="postText" placeholder="Waan yaadde barreessi..."></textarea>
  <input type="file" id="videoFile" accept="video/*">
  <button onclick="addPost()">Post godhi</button>

  <h3>Posts</h3>
  <div id="posts"></div>
</div>

<div id="bottomNav">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goProfile()">👤 Profile</button>
  <button onclick="goMeet()">🎥 Meet</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",
projectId:"abseapp-b3706",
storageBucket:"abseapp-b3706.firebasestorage.app",
messagingSenderId:"986026055368",
appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let api=null;

// Auth listener
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href = "index.html";
  } else {
    document.getElementById("userEmail").innerText = user.email;
    loadPosts();
  }
});

// Logout
function logout(){ auth.signOut().then(()=>window.location.href="index.html"); }

// Navigation
function goHome(){ window.location.href="home.html"; }
function goProfile(){ window.location.href="profile.html"; }
function goMeet(){ window.location.href="liveclass.html"; }

// Profile
function showProfile(){
  const name = prompt("Maqaa kee galchi");
  if(!name) return;
  const user = auth.currentUser;
  db.collection("users").doc(user.uid).set({name:name,email:user.email});
  alert("Profile save ta'e ✔");
  window.location.href="profile.html";
}

// ----------------- Post Functions -----------------

function addPost(){
  const user = auth.currentUser;
  if(!user) return;

  const text = document.getElementById("postText").value;
  const file = document.getElementById("videoFile").files[0];

  if(file){
    const storageRef = storage.ref().child(`userVideos/${user.uid}/${Date.now()}_${file.name}`);
    storageRef.put(file).then(()=>storageRef.getDownloadURL().then(url=>{
      savePostToFirestore(user, text, url);
    }));
  } else {
    savePostToFirestore(user, text, "");
  }
}

function savePostToFirestore(user, text, videoURL){
  db.collection("posts").add({
    userUid: user.uid,
    userEmail: user.email,
    text: text || "",
    videoURL: videoURL || "",
    date: new Date()
  }).then(()=>{
    document.getElementById("postText").value="";
    document.getElementById("videoFile").value="";
  });
}

// Load posts
function loadPosts(){
  const user = auth.currentUser;
  db.collection("posts").orderBy("date","desc").onSnapshot(snapshot=>{
    const container = document.getElementById("posts");
    container.innerHTML = "";

    snapshot.forEach(doc=>{
      const postData = doc.data();
      const post = document.createElement("div");
      post.className="post";

      post.innerHTML=`
        <h4>${postData.userEmail}</h4>
        <p>${postData.text}</p>
        ${postData.videoURL ? `<video class="feedVideo" src="${postData.videoURL}" controls muted loop></video>` : ""}
        <button onclick="toggleLike('${doc.id}')">❤️ Like</button>
        <span id="like-count-${doc.id}">0</span>
        <button onclick="commentPost('${doc.id}')">💬 Comment</button>
        <div id="c-${doc.id}"></div>
        <button onclick="sharePost('${doc.id}')">🔗 Share</button>
      `;

      container.appendChild(post);

      // Like listener
      db.collection("posts").doc(doc.id).collection("likes").onSnapshot(snap=>{
        document.getElementById(`like-count-${doc.id}`).innerText = snap.size;
      });

      // Comments listener
      db.collection("posts").doc(doc.id).collection("comments").orderBy("date").onSnapshot(snap=>{
        const area = document.getElementById("c-"+doc.id);
        area.innerHTML = "";
        snap.forEach(c=>{
          const p=document.createElement("p");
          p.textContent=`${c.data().user}: ${c.data().text}`;
          area.appendChild(p);
        });
      });
    });

    setupAutoPlay();
  });
}

// Like toggle
function toggleLike(postId){
  const user = auth.currentUser;
  if(!user) return;

  const likeRef = db.collection("posts").doc(postId).collection("likes").doc(user.uid);
  likeRef.get().then(doc=>{
    if(doc.exists){ likeRef.delete(); } 
    else { likeRef.set({userUid:user.uid,date:new Date()}); }
  });
}

// Comment
function commentPost(postId){
  const user = auth.currentUser;
  if(!user) return;
  const text = prompt("Comment kee barreessi");
  if(!text) return;
  db.collection("posts").doc(postId).collection("comments").add({
    user: user.email,
    text: text,
    date: new Date()
  });
}

// Share
function sharePost(postId){
  db.collection("posts").doc(postId).get().then(doc=>{
    if(!doc.exists) return alert("Post hin jiru!");
    const post = doc.data();
    let text = `Barnoota Live Post\n\n${post.userEmail}:\n${post.text}`;
    if(post.videoURL) text+=`\nVideo: ${post.videoURL}`;
    navigator.clipboard.writeText(text).then(()=>alert("Post copy godhame!"));
  });
}

// Video autoplay
function setupAutoPlay(){
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.play();
      else entry.target.pause();
    });
  }, {threshold:0.6});
  document.querySelectorAll(".feedVideo").forEach(v=>observer.observe(v));
}

// ----------------- Meet Functions -----------------

function startMeet(){
  const user = auth.currentUser;
  if(!user) return alert("Login godhi!");
  const roomName = "BarnootaLiveRoom_" + Date.now();

  db.collection("meetings").doc(roomName).set({
    host: user.uid,
    hostEmail: user.email,
    roomName: roomName,
    createdAt: new Date()
  });

  document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
  api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: roomName,
    parentNode: document.querySelector("#meet"),
    width:"100%",
    height:"100%"
  });

  const shareBtn = document.createElement("button");
  shareBtn.textContent="🔗 Copy Meeting Link";
  shareBtn.style.marginTop="8px";
  shareBtn.onclick=()=>{ 
    const link = `${location.origin}/liveclass.html?room=${roomName}`;
    navigator.clipboard.writeText(link).then(()=>alert("Link copy godhame!")); 
  };
  document.getElementById("content").appendChild(shareBtn);
}

function joinMeet(){
  const room = prompt("Room link ykn code galchi:");
  if(!room) return;
  const roomName = room.includes("room=")? new URL(room).searchParams.get("room"): room;
  if(!roomName) return alert("Room code sirrii miti!");
  document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
  api = new JitsiMeetExternalAPI("meet.jit.si",{
    roomName: roomName,
    parentNode: document.querySelector("#meet"),
    width:"100%",
    height:"100%"
  });
}

</script>
</body>
</html>
