<script>
const firebaseConfig={
apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
authDomain:"abseapp-b3706.firebaseapp.com",

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;

// Auth listener
auth.onAuthStateChanged(user=>{
  if(!user) window.location.href="index.html";
  currentUser = user;
  document.getElementById("userEmail").innerText = user.email;
  loadPosts();
});

// Logout
function logout(){ auth.signOut().then(()=>window.location.href="index.html"); }

// Navigation
function goHome(){ window.location.href="home.html"; }
function goProfile(){ window.location.href="profile.html"; }
function goMeet(){ window.location.href="liveclass.html"; }

// Add post
function addPost(){
  const text = document.getElementById("postText").value;
  const file = document.getElementById("videoFile").files[0];
  if(!currentUser) return;
  if(!text && !file) return alert("Text ykn video galchi!");

  if(!file){
    db.collection("posts").add({
      text:text,
      userEmail: currentUser.email,
      userName: currentUser.displayName || currentUser.email,
      userUid: currentUser.uid,
      videoURL:"",
      date:new Date()
    }).then(()=>document.getElementById("postText").value="");
    return;
  }

  const storageRef = storage.ref().child("userVideos/"+currentUser.uid+"/"+Date.now()+"_"+file.name);
  const uploadTask = storageRef.put(file);

  uploadTask.on('state_changed', null, 
    error => alert("Video upload fail: "+error),
    ()=>{
      uploadTask.snapshot.ref.getDownloadURL().then(url=>{
        db.collection("posts").add({
          text:text,
          userEmail: currentUser.email,
          userName: currentUser.displayName || currentUser.email,
          userUid: currentUser.uid,
          videoURL:url,
          date:new Date()
        }).then(()=>{
          document.getElementById("postText").value="";
          document.getElementById("videoFile").value="";
        });
      });
    }
  );
}

// Load posts
function loadPosts(){
  db.collection("posts").orderBy("date","desc").onSnapshot(snapshot=>{
    const container = document.getElementById("posts");
    container.innerHTML="";
    snapshot.forEach(doc=>{
      const data = doc.data();
      const div = document.createElement("div");
      div.className="post";
      div.innerHTML = `
        <h4>${data.userName || data.userEmail}</h4>
        <p>${data.text}</p>
        ${data.videoURL ? `<video class="feedVideo" src="${data.videoURL}" controls muted loop></video>` : ""}
        <button onclick="toggleLike('${doc.id}')">❤️ Like</button>
        <span id="like-${doc.id}">❤️ 0</span>
        <button onclick="commentPost('${doc.id}')">💬 Comment</button>
        <div id="c-${doc.id}"></div>
        <button onclick="sharePost('${doc.id}')">🔗 Share</button>
      `;
      container.appendChild(div);

      // Load likes count
      updateLikeCount(doc.id);

      // Load comments
      db.collection("posts").doc(doc.id).collection("comments").orderBy("date")
        .onSnapshot(snap=>{
          const area = document.getElementById("c-"+doc.id);
          area.innerHTML="";
          snap.forEach(c=>{
            const p = document.createElement("p");
            p.textContent = `${c.data().user}: ${c.data().text}`;
            area.appendChild(p);
          });
        });
    });
    setupAutoPlay();
  });
}

// Like
function toggleLike(postId){
  const likeRef = db.collection("posts").doc(postId).collection("likes").doc(currentUser.uid);
  likeRef.get().then(doc=>{
    if(doc.exists) likeRef.delete();
    else likeRef.set({userUid:currentUser.uid,date:new Date()});
  });
}

function updateLikeCount(postId){
  db.collection("posts").doc(postId).collection("likes")
    .onSnapshot(snapshot=>{
      const el = document.getElementById("like-"+postId);
      if(el) el.innerText = "❤️ "+snapshot.size;
    });
}

// Comment
function commentPost(postId){
  const text = prompt("Comment kee barreessi:");
  if(!text) return;
  db.collection("posts").doc(postId).collection("comments").add({
    text:text,
    user:currentUser.email,
    date:new Date()
  });
}

// Share
function sharePost(postId){
  db.collection("posts").doc(postId).get().then(doc=>{
    if(!doc.exists) return alert("Post hin jiru!");
    const data = doc.data();
    let text = `Barnoota Live Post\n\n${data.userName || data.userEmail}:\n${data.text}`;
    if(data.videoURL) text += `\nVideo: ${data.videoURL}`;
    navigator.clipboard.writeText(text).then(()=>alert("Post copy godhame!"));
  });
}

// Video autoplay
function setupAutoPlay(){
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.play();
      else entry.target.pause();
    });
  }, {threshold:0.6});
  document.querySelectorAll(".feedVideo").forEach(v=>observer.observe(v));
}

// MEET functions (start/join) same as before
let api=null;
function startMeet(){
  const roomName = "BarnootaLiveRoom_"+Date.now();
  db.collection("meetings").doc(roomName).set({host:currentUser.uid,hostEmail:currentUser.email,roomName:roomName,createdAt:new Date()});
  document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
  api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:roomName,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
  const shareBtn=document.createElement("button");
  shareBtn.textContent="🔗 Copy Meeting Link";
  shareBtn.style.marginTop="8px";
  shareBtn.onclick=()=>{navigator.clipboard.writeText(`${location.origin}/liveclass.html?room=${roomName}`).then(()=>alert("Link copy godhame!"));};
  document.getElementById("content").appendChild(shareBtn);
}

function joinMeet(){
  const room = prompt("Room link ykn code galchi:");
  if(!room) return;
  const roomName = room.includes("room=")? new URL(room).searchParams.get("room"):room;
  document.getElementById("content").innerHTML=`<div id="meet" style="height:80vh;"></div>`;
  api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:roomName,parentNode:document.querySelector("#meet"),width:"100%",height:"100%"});
}
  function toggleAdd() {
  document.getElementById("addMenu").classList.toggle("show");
}

function toggleLearning() {
  document.getElementById("learningMenu").classList.toggle("show");
}

function toggleMenu() {
  alert("Settings coming soon...");
    }
</script>
