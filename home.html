<!DOCTYPE html>
<html>
<head>
  <title>Home - Barnoota Live</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{ margin:0; background:#1c1c1c; color:white; font-family:Arial; }

    #topbar{
      background:#2d2d2d;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    #menu{
      display:flex;
      gap:10px;
      padding:20px;
      flex-wrap:wrap;
    }

    .card{
      background:#2d2d2d;
      padding:20px;
      border-radius:10px;
      width:140px;
      text-align:center;
      cursor:pointer;
    }

    button{
      background:red;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #feed{ padding:15px; }

    .post{
      background:#1f1f1f;
      padding:12px;
      border-radius:10px;
      margin-bottom:15px;
      box-shadow:0 0 5px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

<div id="topbar">
  <div>👤 <span id="userEmail">Loading...</span></div>
  <button onclick="logout()">Logout</button>
</div>

<div id="feed">
  <button onclick="openProfile()">Profile</button>

  <div class="post">
    <h3>Barnoota Haaraa</h3>
    <video controls width="100%">
      <source src="video1.mp4" type="video/mp4">
    </video>
    <p>Barnoota Afaan Oromoo live class irratti baradhaa.</p>
    <button onclick="addPost()">➕ Post</button>
  </div>
</div>

<div id="menu">
  <div class="card" onclick="createMeeting()">📹<br>Meet</div>
  <div class="card" onclick="joinMeeting()">🔑<br>Join</div>
  <div class="card">📅<br>Schedule</div>
  <div class="card">🔗<br>Share</div>
  <div class="card">⚙️<br>Settings</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain: "absejamaal-772e3.firebaseapp.com",
  projectId: "absejamaal-772e3",
  storageBucket: "absejamaal-772e3.appspot.com",
  messagingSenderId: "522756860286",
  appId: "1:522756860286:web:d78a03faf3861347e26b2f"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("userEmail").innerText = user.email;
    localStorage.setItem("userEmail", user.email);
  }else{
    window.location.href = "index.html";
  }
});

function logout(){
  auth.signOut().then(()=> window.location.href="index.html");
}

function addPost(){
  const text = prompt("Barreeffama galchi");

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*,video/*";

  fileInput.onchange = () => {
    const file = fileInput.files[0];

    const name = localStorage.getItem("profileName") || "User";
    const img = localStorage.getItem("profileImg") || "https://via.placeholder.com/40";

    const post = document.createElement("div");
    post.className = "post";

    let media = "";
    if(file){
      const url = URL.createObjectURL(file);

      if(file.type.startsWith("image")){
        media = `<img src="${url}" style="width:100%;border-radius:8px;margin-top:10px;">`;
      }
      else if(file.type.startsWith("video")){
        media = `<video controls style="width:100%;border-radius:8px;margin-top:10px;"><source src="${url}"></video>`;
      }
    }

    post.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="${img}" style="width:40px;height:40px;border-radius:50%;">
        <b>${name}</b>
      </div>
      <p>${text || ""}</p>
      ${media}
    `;

    document.getElementById("feed").prepend(post);
  };

  fileInput.click();
}

function createMeeting(){
  const room = Math.random().toString(36).substring(2,10);
  window.location.href = "liveclass.html?room=" + room;
}

function joinMeeting(){
  const room = prompt("Meeting link ykn ID galchi");
  if(room){
    window.location.href = "liveclass.html?room=" + room;
  }
}

function openProfile(){
  window.location.href = "profile.html";
}
</script>

</body>
</html>
