<!DOCTYPE html>
<html>
<head>
<title>Barnoota Live - Home</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://meet.jit.si/external_api.js"></script>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

#topbar{
  background:#1e293b;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#menu{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px;
}

button{
  background:#2563eb;
  border:none;
  color:white;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

#content{
  padding:15px;
  padding-bottom:80px;
}

.post{
  background:#1e293b;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}

textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
}

/* Bottom Navigation */
#bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#111827;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #333;
}
#bottomNav button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
}
</style>
</head>

<body>

<div id="topbar">
  <div>Barnoota Live</div>
  <div id="userEmail">Loading...</div>
</div>

<div id="menu">
  <button onclick="showProfile()">Profile</button>
  <button onclick="startMeet()">Meet</button>
  <button onclick="joinMeet()">Join</button>
  <button onclick="sharePost()">Share</button>
  <button onclick="scheduleClass()">Schedule</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="content">
  <h3>Post haaraa</h3>
  <textarea id="postText" placeholder="Waan yaadde barreessi..."></textarea>
  <button onclick="addPost()">Post godhi</button>
  <div id="posts"></div>
</div>

<!-- Bottom Navigation -->
<div id="bottomNav">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goProfile()">👤 Profile</button>
  <button onclick="goMeet()">🎥 Meet</button>
  <button onclick="join()"> Join</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
  authDomain:"abseapp-b3706.firebaseapp.com",
  projectId:"abseapp-b3706",
  storageBucket:"abseapp-b3706.firebasestorage.app",
  messagingSenderId:"986026055368",
  appId:"1:986026055368:web:8ad2557f64c24d3c28b7fd"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("userEmail").innerText=user.email;
    loadPosts();
  }else{
    window.location.href="index.html";
  }
});

function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}

function showProfile(){
const name = prompt("Maqaa kee galchi");
if(!name) return;

const user = auth.currentUser;

db.collection("users").doc(user.uid).set({
name: name,
email: user.email
});

alert("Profile save ta'e ✔");
}{
  window.location.href="profile.html";
}

/* POST SYSTEM */
function addPost(){
const text=document.getElementById("postText").value;
if(!text) return;

const user=auth.currentUser;

db.collection("users").doc(user.uid).get().then(doc=>{
const name = doc.exists ? doc.data().name : user.email;

db.collection("posts").add({
text:text,
userEmail:user.email,
userName:name,
likes:0,
date:new Date()
});
});

document.getElementById("postText").value="";
}{
const user=auth.currentUser;
const text=document.getElementById("postText").value;
if(!text || !user) return;

db.collection("posts").add({
text:text,
userEmail:user.email,
date:new Date()
});

document.getElementById("postText").value="";
  }

function loadPosts(){
  db.collection("posts").orderBy("date","desc")
  .onSnapshot(snapshot=>{
    const container=document.getElementById("posts");
    container.innerHTML="";
    snapshot.forEach(doc=>{
      const post=document.createElement("div");
      post.className="post";
      post.innerHTML=`
<h4>${doc.data().userEmail}</h4>
<p>${doc.data().text}</p>

<button onclick="likePost('${doc.id}')">❤️ Like</button>
<span id="like-${doc.id}">❤️ 0</span>

<button onclick="commentPost('${doc.id}')">💬 Comment</button>
<div id="c-${doc.id}"></div>
`;
<p>${doc.data().text}</p>
<button onclick="likePost('${doc.id}')">❤️ Like</button>
<span id="like-${doc.id}">❤️ 0</span>
<button onclick="commentPost('${doc.id}')">💬 Comment</button>
<div id="c-${doc.id}"></div>
`;
<p>${doc.data().text}</p>
<button onclick="likePost('${doc.id}')">❤️ Like</button>
<button onclick="commentPost('${doc.id}')">💬 Comment</button>
<div id="c-${doc.id}"></div>
`;
        <p>${doc.data().text}</p>
        <button onclick="likePost('${doc.id}')">Like</button>
        <button onclick="commentPost('${doc.id}')">Comment</button>
      `;
      container.appendChild(post);
      updateLikeCount(doc.id);
      db.collection("posts").doc(doc.id)
.collection("comments")
.orderBy("date")
.onSnapshot(snap=>{
  const area=document.getElementById("c-"+doc.id);
  area.innerHTML="";
  snap.forEach(c=>{
    const p=document.createElement("p");
    p.textContent=c.data().user+" : "+c.data().text;
    area.appendChild(p);
  });
});

});

function likePost(id){
const user=auth.currentUser;
if(!user) return;
function updateLikeCount(id){
db.collection("posts").doc(id)
.collection("likes")
.onSnapshot(snapshot=>{
const el=document.getElementById("like-"+id);
if(el) el.innerText="❤️ "+snapshot.size;
});
    }
const ref=db.collection("posts").doc(id);

ref.collection("likes").doc(user.uid).set({
user:user.email
});

updateLikeCount(id);
  }
function commentPost(id){
  const text=prompt("Comment kee barreessi");
  if(!text) return;

  const user=auth.currentUser;

  db.collection("posts")
  .doc(id)
  .collection("comments")
  .add({
    text:text,
    user:user.email,
    date:new Date()
  });
    }
function sharePost(){ alert("Share system itti fufna"); }
function scheduleClass(){ alert("Schedule system itti fufna"); }

/* MEET */
let api=null;

function startMeet(){
  document.getElementById("content").innerHTML='<div id="meet" style="height:80vh;"></div>';

  api=new JitsiMeetExternalAPI("meet.jit.si",{
    roomName:"BarnootaLiveRoom",
    parentNode:document.querySelector("#meet"),
    width:"100%",
    height:"100%"
  });
}

function joinMeet(){ startMeet(); }

/* NAVIGATION */
function goHome(){ window.location.href="home.html"; }
function goProfile(){ window.location.href="profile.html"; }
function goMeet(){ window.location.href="liveclass.html"; }
function goSchedule(){ alert("Schedule system itti aansuun siif ijaara"); }

/* BACK BUTTON CONTROL */
history.pushState(null, null, location.href);
window.onpopstate = function(){
  window.location.href="liveclass.html";
};
</script>

</body>
</html>
