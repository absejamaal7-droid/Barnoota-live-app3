
<!DOCTYPE html>
<html>
<head>
  <title>Home - Barnoota Live</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#1c1c1c;
      color:white;
      font-family:Arial;
    }

    #topbar{
      background:#2d2d2d;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    #menu{
      display:flex;
      gap:10px;
      padding:20px;
      flex-wrap:wrap;
    }

    .card{
      background:#2d2d2d;
      padding:20px;
      border-radius:10px;
      width:140px;
      text-align:center;
      cursor:pointer;
      transition:0.2s;
    }

    .card:hover{
      background:#444;
    }

    button{
      background:red;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<!-- 🔝 Top Bar -->
<div id="topbar">
  <div>
    👤 <span id="userEmail">Loading...</span>
  </div>
  <button onclick="logout()">Logout</button>
</div>

<!-- 📌 Menu -->
<div id="menu">

  <div class="card" onclick="createMeeting()">
    📹<br>Meet
  </div>

  <div class="card" onclick="joinMeeting()">
    🔑<br>Join
  </div>

  <div class="card">
    📅<br>Schedule
  </div>

  <div class="card">
    🔗<br>Share
  </div>

  <div class="card">
    ⚙️<br>Settings
  </div>

</div>

<script>
  // 🔥 Firebase Config (kan ati argatte galchi)
  const firebaseConfig = {
    apiKey: "API_KEY_KEE",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.firebasestorage.app",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:e14f9559c01b0d57e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // 👤 User check
  auth.onAuthStateChanged(user => {
    if(user){
      document.getElementById("userEmail").innerText = user.email;
    }else{
      window.location.href = "index.html";
    }
  });

  function logout(){
    auth.signOut().then(()=>{
      window.location.href = "index.html";
    });
  }

  // 📹 Create meeting
  function createMeeting(){
    const room = Math.random().toString(36).substring(2,10);
    window.location.href = "live.html?room=" + room;
  }

  // 🔑 Join meeting
  function joinMeeting(){
    const room = prompt("Meeting ID galchi");
    if(room){
      window.location.href = "live.html?room=" + room;
    }
  }
</script>

</body>
</html>
