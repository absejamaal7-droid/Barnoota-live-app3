<!DOCTYPE html>
<html>
<head>
  <title>Home - Barnoota Live</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#1c1c1c;
      color:white;
      font-family:Arial;
    }
    #topbar{
      background:#2d2d2d;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    #menu{
      display:flex;
      gap:10px;
      padding:20px;
      flex-wrap:wrap;
    }
    .card{
      background:#2d2d2d;
      padding:20px;
      border-radius:10px;
      width:140px;
      text-align:center;
      cursor:pointer;
      transition:0.2s;
    }
    .card:hover{ background:#444; }
    button{
      background:red;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }
    #feed{
      padding:15px;
    }
    .post{
      background:#1f1f1f;
      padding:12px;
      border-radius:10px;
      margin-bottom:15px;
    }
  </style>
</head>

<body>

<div id="topbar">
  <div>👤 <span id="userEmail">Loading...</span></div>
  <button onclick="logout()">Logout</button>
</div>

<!-- FEED AREA -->
<div id="feed">

  <div class="post">
    <h3>Barnoota Haaraa</h3>
    <video controls width="100%">
      <source src="video1.mp4" type="video/mp4">
    </video>
    <p>Barnoota Afaan Oromoo live class irratti baradhaa.</p>
    <button onclick="addPost()">➕ Post</button>
  </div>

  <div class="post">
    <h3>Beeksisa</h3>
    <p>Live class haaraa bor sa'aatii 3:00 irratti ni jalqaba.</p>
  </div>

</div>

<div id="menu">
  <div class="card" onclick="createMeeting()">📹<br>Meet</div>
  <div class="card" onclick="joinMeeting()">🔑<br>Join</div>
  <div class="card">📅<br>Schedule</div>
  <div class="card">🔗<br>Share</div>
  <div class="card">⚙️<br>Settings</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    if(user){
      document.getElementById("userEmail").innerText = user.email;
    }else{
      window.location.href = "index.html";
    }
  });

  function logout(){
    auth.signOut().then(()=> window.location.href="index.html");
  }

  function addPost(){
    const text = prompt("Barreeffama galchi");
    if(!text) return;

    const post = document.createElement("div");
    post.className = "post";
    post.innerHTML = "<p>"+text+"</p>";

    document.getElementById("feed").prepend(post);
  }

  function createMeeting(){
    const room = Math.random().toString(36).substring(2,10);
    window.location.href = "./liveclass.html?room=" + room;
  }

  function joinMeeting(){
    const room = prompt("Meeting ID galchi");
    if(room){
      window.location.href = "./liveclass.html?room=" + room;
    }
  }
</script>

</body>
</html>
