<!DOCTYPE html>
<html>
<head>
  <title>Barnoota Live</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      width:90%;
      max-width:350px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }
    h2{ text-align:center; margin-bottom:20px; }
    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
    .login{ background:#22c55e; color:white; }
    .signup{ background:#3b82f6; color:white; }
    .divider{ text-align:center; margin:12px 0; opacity:0.6; }
  </style>
</head>

<body>

<!-- Login box isa jalqabaa (hin haqune comment goone) -->

<div class="card">
  <h2>Barnoota Live</h2>

  <input type="email" id="email" placeholder="Email kee">
  <input type="password" id="password" placeholder="Password kee">

  <button class="login" onclick="login()">LOGIN</button>

  <div class="divider">ykn</div>

  <button class="signup" onclick="openSignup()">SIGN UP</button>
</div>

<!-- SIGNUP POPUP -->
<div id="signupBox" style="display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;">

<div style="background:#1e293b;
padding:25px;
border-radius:12px;
width:90%;
max-width:350px;">

<h2>Create Account</h2>

<input id="name" placeholder="Maqaa kee">
<input id="email2" placeholder="Email kee">
<input id="password2" type="password" placeholder="Password">
<input id="confirm" type="password" placeholder="Confirm password">

<button onclick="createAccount()" style="background:#22c55e;color:white;">Create Account</button>

<button onclick="closeSignup()" style="background:#ef4444;color:white;margin-top:8px;">Cancel</button>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
  authDomain: "abseapp-b3706.firebaseapp.com",
  projectId: "abseapp-b3706",
  storageBucket: "abseapp-b3706.firebasestorage.app",
  messagingSenderId: "986026055368",
  appId: "1:986026055368:web:8ad2557f64c24d3c28b7fd",
  measurementId: "G-M57552RVD2"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
window.onpopstate = function () {
  if(confirm("App keessaa bahuu barbaaddaa?")){
  } else window.close();
};
function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
  .then((userCredential)=>{
    console.log("Login successful:", userCredential.user.email);
    window.location.href="home.html";
  })
  .catch((error)=>{
    alert("Login failed: "+error.message);
  });

}

function signup(){
  openSignup();
}

function openSignup(){
  document.getElementById("signupBox").style.display="flex";
}

function closeSignup(){
  document.getElementById("signupBox").style.display="none";
}

function createAccount(){

const name=document.getElementById("name").value;
const email=document.getElementById("email2").value;
const pass=document.getElementById("password2").value;
const confirm=document.getElementById("confirm").value;

if(pass!==confirm){
alert("Password hin walfakkaatu");
return;
}

auth.createUserWithEmailAndPassword(email,pass)
.then((userCredential)=>{

const user=userCredential.user;

db.collection("users").doc(user.uid).set({
name:name,
email:email,
uid:user.uid
});

alert("Account created successfully");

window.location.href="home.html";

})
.catch((error)=>{
alert(error.message);
});

}

auth.onAuthStateChanged(user=>{
  if(user){
    window.location.href="home.html";
  }
});
</script>

</body>
</html>
