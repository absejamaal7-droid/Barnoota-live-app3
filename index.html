<!DOCTYPE html>
<html>
<head>
  <title>Barnoota Live</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      width:90%;
      max-width:350px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }
    h2{ text-align:center; margin-bottom:20px; }
    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
    .login{ background:#22c55e; color:white; }
    .signup{ background:#3b82f6; color:white; }
    .divider{ text-align:center; margin:12px 0; opacity:0.6; }
  </style>
</head>

<body>

<div class="card">
  <h2>Barnoota Live</h2>

  <input type="email" id="email" placeholder="Email kee">
  <input type="password" id="password" placeholder="Password kee">

  <button class="login" onclick="login()">LOGIN</button>

  <div class="divider">ykn</div>

  <button class="signup" onclick="signup()">SIGN UP</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain: "absejamaal-772e3.firebaseapp.com",
  projectId: "absejamaal-772e3",
  storageBucket: "absejamaal-772e3.appspot.com",
  messagingSenderId: "522756860286",
  appId: "1:522756860286:web:d78a03faf3861347e26b2f"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(()=> window.location.href="home.html")
    .catch(e => alert(e.message));
}

function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(()=> alert("Account tolchee jira! Amma login godhi."))
    .catch(e => alert(e.message));
}
</script>

</body>
</html>
