<!DOCTYPE html>
<html>
<head>
  <title>Barnoota Live</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      width:90%;
      max-width:350px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }
    h2{ text-align:center; margin-bottom:20px; }
    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
    .login{ background:#22c55e; color:white; }
    .signup{ background:#3b82f6; color:white; }
    .divider{ text-align:center; margin:12px 0; opacity:0.6; }
  </style>
</head>

<body>
  
<div style="text-align:center;margin-top:100px;">

<h2>Barnoota Live</h2>

<input id="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Signup</button>

<button onclick="login()">Login</button>

</div>
  
<div class="card">
  <h2>Barnoota Live</h2>

  <input type="email" id="email" placeholder="Email kee">
  <input type="password" id="password" placeholder="Password kee">

  <button class="login" onclick="login()">LOGIN</button>

  <div class="divider">ykn</div>

  <button class="signup" onclick="signup()">SIGN UP</button>
</div>

<!-- Firebase (compat version) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
  authDomain: "abseapp-b3706.firebaseapp.com",
  projectId: "abseapp-b3706",
  storageBucket: "abseapp-b3706.firebasestorage.app",
  messagingSenderId: "986026055368",
  appId: "1:986026055368:web:8ad2557f64c24d3c28b7fd",
  measurementId: "G-M57552RVD2"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// LOGIN function
function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      console.log("Login successful:", userCredential.user.email);
      window.location.href = "home.html"; // gara home.html deemsa
    })
    .catch((error) => {
      console.log(error.code, error.message);
      alert("Login failed: " + error.message);
    });
}

// SIGNUP function
function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
      console.log("Signup successful:", userCredential.user.email);
      alert("Account tolchee jira! Amma login godhi.");
    })
    .catch((error) => {
      console.log(error.code, error.message);
      alert("Signup failed: " + error.message);
    });
}

// Optional: auto redirect yoo user login ta'e
auth.onAuthStateChanged(user => {
  if(user){
    window.location.href = "home.html";
  }
});
</script>

</body>
</html>
