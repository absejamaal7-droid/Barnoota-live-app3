<!DOCTYPE html>
<html>
<head>
  <title>Barnoota Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

      color:white;

      height:100vh;
    }

    .card{

    }

    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

    .login{
      background:#22c55e;
      color:white;
    }

    .signup{
      background:#3b82f6;
      color:white;
    }

    .divider{
      text-align:center;
      margin:12px 0;
      opacity:0.6;
    }
  </style>
</head>

</html>
