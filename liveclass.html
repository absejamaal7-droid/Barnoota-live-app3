<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#121212;
      color:white;
      font-family:Arial;
    }

    /* TOP BAR */
    #topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:50px;
      background:#1f1f1f;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
      z-index:10;
    }

    .room-btn{
      background:#2563eb;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #meet{
      margin-top:50px;
      height:calc(100vh - 110px);
      width:100%;
    }

    /* BOTTOM BAR */
    #bottombar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:60px;
      background:#1f1f1f;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      z-index:10;
      flex-wrap:wrap;
    }

    .control-btn{
      background:#333;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    .record{ background:#f59e0b; }
    .stop{ background:#10b981; }
    .leave{ background:#ef4444; }
    .breakroom{ background:#6366f1; }
  </style>
</head>

<body>

<!-- TOP -->
<div id="topbar">
  <button class="room-btn" id="roomBtn">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- MEETING -->
<div id="meet"></div>

<!-- CONTROLS -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn breakroom" onclick="goBreakroom()">🛋 Breakroom</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  // Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById("username").innerText = user.email;
    }else{
      window.location.href="index.html";
    }
  });

  // Room selection button
  const roomBtn = document.getElementById("roomBtn");
  roomBtn.addEventListener("click",()=>{
    const roomNumber = prompt("Room filadhu (1…1000+):");
    if(roomNumber){
      const roomName = "Room-" + roomNumber;
      joinRoom(roomName);
    }
  });

  // Get room from URL
  const urlParams = new URLSearchParams(window.location.search);
  const roomName = urlParams.get("room") || null;
  if(roomName) joinRoom(roomName);

  let api = null;

  function joinRoom(name){
    document.getElementById("roomBtn").innerText = name;

    api = new JitsiMeetExternalAPI("meet.jit.si",{
      roomName: name,
      width:"100%",
      height:"100%",
      parentNode: document.querySelector("#meet"),
      configOverwrite: {
        prejoinPageEnabled: false,
        disableDeepLinking: true,
        startWithAudioMuted: false,
        startWithVideoMuted: false
      },
      interfaceConfigOverwrite: {
        DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
        HIDE_INVITE_MORE_HEADER: true,
        MOBILE_APP_PROMO: false,
        SHOW_JITSI_WATERMARK: false,
        SHOW_BRAND_WATERMARK: false,
        TOOLBAR_BUTTONS: ["microphone","camera","chat","desktop","settings","raisehand","hangup"]
      }
    });

    // Host password
    api.addEventListener("videoConferenceJoined", () => {
      if(confirm("Ati host dha? Yoo eeyyee password kaa'i:")){
        const pass = prompt("Meeting password galchi (host qofatu kaa'a)");
        if(pass) api.executeCommand("password", pass);
      }
    });
  }

  // Controls
  function toggleMute(){ api.executeCommand("toggleAudio"); }
  function toggleVideo(){ api.executeCommand("toggleVideo"); }
  function openChat(){ api.executeCommand("toggleChat"); }
  function shareScreen(){ api.executeCommand("toggleShareScreen"); }
  function openSettings(){ api.executeCommand("toggleSettings"); }
  function sendEmoji(){ api.executeCommand("sendTones"); }
  function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
  function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }

  // Breakroom → room selection without leaving meeting
  function goBreakroom(){
    alert("Breakroom: Gara room filannoo deebi'ameera.");
    document.getElementById("meet").innerHTML="";
    roomBtn.innerText="Room";
    api = null;
  }

  // Leave meeting
  function leaveMeeting(){
    api.executeCommand("hangup");
    window.location.href="home.html";
  }
</script>

</body>
</html>
