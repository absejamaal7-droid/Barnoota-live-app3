<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    #topbar {
      background: #1f1f1f;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #meet {
      height: 82vh;
      width: 100%;
    }

    .room-btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    #bottombar {
      height: 8vh;
      background: #1f1f1f;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .leave {
      background: #ff3b3b;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- MEETING -->
<div id="meet"></div>

<!-- CONTROLS -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤 Mute</button>
  <button class="control-btn" onclick="toggleVideo()">📷 Video</button>
  <button class="control-btn" onclick="openChat()">💬 Chat</button>
  <button class="control-btn" onclick="shareScreen()">🖥 Share</button>
  <button class="control-btn" onclick="openSettings()">⚙️ Settings</button>
  <button class="control-btn" onclick="sendEmoji()">😊 Emoji</button>
  <button class="control-btn" onclick="startRecording()">⏺ Start Rec</button>
  <button class="control-btn" onclick="stopRecording()">⏹ Stop Rec</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(function(user) {
    if (user) {
      document.getElementById("username").innerText = user.email;
    } else {
      window.location.href = "index.html";
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const roomName = urlParams.get("room") || "Barnoota-Live";
  document.getElementById("roomName").innerText = roomName;

  // Jitsi without phone numbers
  const domain = "meet.jit.si";
  const options = {
    roomName: roomName,
    width: "100%",
    height: "100%",
    parentNode: document.querySelector("#meet"),
    interfaceConfigOverwrite: {
      TOOLBAR_BUTTONS: [
        'microphone', 'camera', 'chat', 'desktop', 'settings',
        'raisehand', 'hangup', 'emoji-menu', 'recording'
      ],
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      DEFAULT_REMOTE_DISPLAY_NAME: 'Participant',
      DEFAULT_LOCAL_DISPLAY_NAME: 'Me',
      SHOW_POWERED_BY: false,
      SHOW_DEEP_LINKING_LOGO: false,
      SHOW_PHONE_LABEL: false // <-- Phone numbers hide
    }
  };
  const api = new JitsiMeetExternalAPI(domain, options);

  function toggleMute() { api.executeCommand("toggleAudio"); }
  function toggleVideo() { api.executeCommand("toggleVideo"); }
  function openChat() { api.executeCommand("toggleChat"); }
  function shareScreen() { api.executeCommand("toggleShareScreen"); }
  function openSettings() { api.executeCommand("toggleSettings"); }
  function sendEmoji() { api.executeCommand("sendTones"); }
  function leaveMeeting() {
    api.executeCommand("hangup");
    window.location.href = "home.html";
  }

  function startRecording() { api.executeCommand("startRecording", { mode: "file" }); }
  function stopRecording() { api.executeCommand("stopRecording", { mode: "file" }); }
</script>

</body>
</html>
