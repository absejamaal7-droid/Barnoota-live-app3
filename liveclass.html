<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    #topbar {
      background: #1f1f1f;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #meet {
      height: 82vh;
      width: 100%;
    }

    /* Room button gubbaa bitaa */
    .room-btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Control bar jala */
    #bottombar {
      height: 8vh;
      background: #1f1f1f;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .leave {
      background: #ff3b3b;
    }
  </style>
</head>

<body>

<!-- left -->
<div id="left">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- Meeting -->
<div id="meet"></div>

<!-- Controls -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤 Mute</button>
  <button class="control-btn" onclick="toggleVideo()">📷 Video</button>
  <button class="control-btn" onclick="openChat()">💬 Chat</button>
  <button class="control-btn" onclick="shareScreen()">🖥 Share</button>
  <button class="control-btn" onclick="openSettings()">⚙️ Settings</button>
  <button class="control-btn" onclick="sendEmoji()">😊 Emoji</button>
  <button class="control-btn" id="startRec" onclick="startRecording()">⏺ Start Rec</button>
  <button class="control-btn" id="stopRec" onclick="stopRecording()">⏹ Stop Rec</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  // 🔥 Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(function(user) {
    if (user) {
      document.getElementById("username").innerText = user.email;
    } else {
      window.location.href = "index.html";
    }
  });

  // Room name unique
  const urlParams = new URLSearchParams(window.location.search);
  const roomName = urlParams.get("room") || "BarnootaLive-" + Math.random().toString(36).substring(2,8);
  document.getElementById("roomName").innerText = roomName;

  const api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: roomName,
    width: "100%",
    height: "100%",
    parentNode: document.querySelector("#meet")
  });

  // Controls
  function toggleMute() { api.executeCommand("toggleAudio"); }
  function toggleVideo() { api.executeCommand("toggleVideo"); }
  function openChat() { api.executeCommand("toggleChat"); }
  function shareScreen() { api.executeCommand("toggleShareScreen"); }
  function openSettings() { api.executeCommand("toggleSettings"); }
  function sendEmoji() { api.executeCommand("sendTones"); }
  function leaveMeeting() {
    api.executeCommand("hangup");
    window.location.href = "home.html";
  }

  // Recording (Jitsi built-in)
  function startRecording() { api.executeCommand("startRecording", {mode: "file"}); }
  function stopRecording() { api.executeCommand("stopRecording", {mode: "file"}); }
</script>

</body>
</html>
