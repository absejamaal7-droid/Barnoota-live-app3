  <style>
    body{margin:0;background:#121212;color:white;font-family:Arial;}
    #topbar{position:fixed;top:0;left:0;right:0;height:50px;background:#1f1f1f;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10;}

    #meet{margin-top:50px;height:calc(100vh - 110px);width:100%;}

    .stop{background:#10b981;}
    .leave{background:#ef4444;}

    /* ROOM MODAL */
    #roomModal{position:fixed;top:50px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;padding:10px;z-index:20;}
    #roomSearch{padding:6px;margin-bottom:8px;border-radius:6px;border:none;font-size:14px;}

    .room-item:hover{background:#444;}
    .modal-buttons{display:flex;justify-content:space-between;margin-top:8px;}
    .modal-btn{flex:1;padding:6px;margin:2px;border:none;border-radius:6px;cursor:pointer;font-size:14px;}

  color:red;

    }
    #participantsPanel{
  display:none;

  top:50px;
  width:280px;
  height:85%;

  color:white;
  z-index:50;

}

#participantsHeader{
  padding:10px;
  background:#1f1f1f;
  text-align:center;

}

.participant{
  display:flex;

  align-items:center;
  padding:8px;

}

.name{
  flex:1;
}

.icons{
  display:flex;
  gap:6px;
}

  0%,100%{opacity:1;}
  50%{opacity:0.3;}
    }
.host{
  color:#22c55e;
  font-size:12px;
  margin-left:5px;
}

.speaking{
  background:#1e293b;
}
    #meet iframe{
  filter: brightness(1.1) contrast(1.1);
    }
    #meet{
  margin-top:50px;
  height:calc(100vh - 110px);
  width:100%;
      }
    #chatMessages div{
  margin:5px 0;
  padding:6px;
  border-radius:8px;
  background:#334155;
}

.myMsg{
  background:#2563eb !important;
  text-align:right;
}

</head>
<body>

🔴 REC

  <!-- Mode select -->

</div>

</div>
<div id="participantsPanel" style="display:none; position:fixed; right:0; top:50px; width:250px; height:80%; background:#1f1f1f; overflow:auto; z-index:20;">
  <h3 style="text-align:center;">Participants</h3>
  <div id="participantsList"></div>
</div>
  <div id="participantsHeader">
  </div>

  <div id="bottombar">
    <button class="control-btn" onclick="toggleFullScreen()">⛶</button>
  <button id="micBtn" class="control-btn" onclick="toggleMute()">🎤</button>
<button id="videoBtn" class="control-btn" onclick="toggleVideo()">📷</button>

  👥 <span id="participantsCount">0</span>
  </button>
    <button class="control-btn" onclick="toggleRaiseHand()">✋</button>

    <button class="control-btn" onclick="OpenChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥 Share</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button id="recordBtn" class="control-btn record" onclick="toggleRecording()">⏺ Start</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
 </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain: "absejamaal-772e3.firebaseapp.com",
  projectId: "absejamaal-772e3",
  storageBucket: "absejamaal-772e3.appspot.com",
  messagingSenderId: "522756860286",
  appId: "1:522756860286:web:d78a03faf3861347e26b2f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("username").innerText = user.email;
  }else{
    window.location.href="index.html";
  }
});
  let myHandRaised = false;
const db = firebase.firestore();
const urlParams = new URLSearchParams(window.location.search);
const roomName = urlParams.get("room") || "Barnoota-Live";
document.getElementById("roomName").innerText = roomName;

const api = new JitsiMeetExternalAPI("meet.jit.si",{
  roomName: roomName,
  width:"100%",
  height:"100%",
  parentNode: document.querySelector("#meet"),
  configOverwrite: {
  prejoinPageEnabled: false,
  disableInviteFunctions: true,
  hiddenPremeetingButtons: ['invite'],
  startWithAudioMuted: false,
  startWithVideoMuted: false,
  enableUserRolesBasedOnToken: false,
  enableNoAudioDetection: false,
  enableNoisyMicDetection: false,
   disableDeepLinking:true,
   enableChat: true},
  
  interfaceConfigOverwrite:
  {DISABLE_JOIN_LEAVE_NOTIFICATIONS:true,
   TILE_VIEW_MAX_COLUMNS: 3,
   HIDE_INVITE_MORE_HEADER:true,
   MOBILE_APP_PROMO:false,
   SHOW_JITSI_WATERMARK:false,
   SHOW_BRAND_WATERMARK:false,
   TOOLBAR_BUTTONS:["microphone","camera","chat","desktop","settings","raisehand","hangup",]}
});
api.addEventListener("dominantSpeakerChanged", (id)=>{
  const items = document.querySelectorAll(".participant");

  items.forEach(item=> item.classList.remove("speaking"));

  const list = api.getParticipantsInfo();

  list.forEach((p, index)=>{
    if(p.participantId === id){
      items[index].classList.add("speaking");
    }
  });
});
  api.addEventListener("raiseHandUpdated", updateParticipants);
api.addEventListener("videoConferenceJoined", ()=>{
  if(api.isModerator()){
  const pass = prompt("Password kaa'i");
  if(pass){
    api.executeCommand("password", pass);
  }
  }

  
  const name = auth.currentUser.email.split("@")[0];
  api.executeCommand("displayName", name);

  // 🎤 Mic ON gochu 
  setTimeout(()=>{
  api.executeCommand("toggleAudio");

  // 🎥 Video ON
  api.executeCommand("toggleVideo");
}, 1000);
  updateParticipants();
});
api.addEventListener("participantJoined", updateParticipants);
api.addEventListener("participantLeft", updateParticipants);
api.addEventListener("displayNameChange", updateParticipants);
api.addEventListener("audioMuteStatusChanged", updateParticipants);
api.addEventListener("videoMuteStatusChanged", updateParticipants);
// CONTROLS
let myName = "";
let role = "student"; // default

// yeroo seentu
api.addEventListener("videoConferenceJoined", ()=>{


  let name = auth.currentUser.email;

  if(name){
    name = name.split("@")[0]; // akka bareedu
  }else{
    name = "User";
  }

  api.executeCommand("displayName", name);
  myName = prompt("Maqaa kee galchi:");
  if(!myName) myName = "User";

  api.executeCommand("displayName", myName);

  // HOST auto (namni jalqaba)
  api.getParticipantsInfo().then(list=>{
    if(list.length === 1){
      role = "host";
      alert("Ati HOST dha");
    }
  });

  loadUsers();
  loadMessages();
});
function togglesendEmojibox(){
  const box = document.getElementById("emojiBox");
  box.style.display = box.style.display === "none" ? "block" : "none";
}
  function sendEmoji(emoji){
  if(api){
    api.executeCommand("sendChatMessage", emoji);
  }
}
  function sendCustomEmoji(){
  const val = document.getElementById("emojiInput").value;
  if(api && val){
    api.executeCommand("sendChatMessage", val);
    document.getElementById("emojiInput").value = "";
  }
  }

function loadUsers(){
  setInterval(()=>{
    if(!api) return;

    api.getParticipantsInfo().then(list=>{
      const select = document.getElementById("privateUser");
      select.innerHTML = "";

      list.forEach(p=>{
        const opt = document.createElement("option");
        opt.value = p.displayName;
        opt.textContent = p.displayName;
        select.appendChild(opt);
      });
    });

  },2000);
}


// MODE CHANGE
document.getElementById("chatMode").addEventListener("change", function(){
  const mode = this.value;
  document.getElementById("privateUser").style.display =
    mode === "private" ? "block" : "none";
});

function toggleFullScreen(){
  const elem = document.documentElement;

  if(!document.fullscreenElement){
    elem.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

function sendMessage(){

  const text = document.getElementById("chatInput").value;
  if(!text) return;

  const mode = document.getElementById("chatMode").value;
  const toUser = document.getElementById("privateUser").value;

  const msg = {
    from: myName,
    text: text,
    mode: mode,
    to: mode === "private" ? toUser : "everyone",
    date: new Date()
  };

  firebase.firestore().collection("liveMessages").add(msg);

  document.getElementById("chatInput").value="";
}


// LOAD MESSAGES
function loadMessages(){

  firebase.firestore().collection("liveMessages")
  .orderBy("date")
  .onSnapshot(snapshot=>{

    const box = document.getElementById("chatMessages");
    box.innerHTML="";

    snapshot.forEach(doc=>{
      const m = doc.data();

      // FILTER
      if(
        m.mode === "everyone" ||
        (m.mode === "private" &&
         (m.to === myName || m.from === myName))
      ){

        const div = document.createElement("div");

        div.className = m.from === myName ? "myMsg" : "";

        div.innerHTML = `
          <b>${m.from}</b>: ${m.text}
        `;

        box.appendChild(div);
      }
    });

    box.scrollTop = box.scrollHeight;
  });
}


// OPEN / CLOSE CHAT
function onclick="openChat(){
  document.getElementById("chatBox").style.display="flex";
  }
function closeChat(){
  document.getElementById("chatBox").style.display="none";
                     }// host check
function isHost(){
  return role === "host";
}

// example: mute all (host qofa)
function muteAll(){
  if(!isHost()){
    alert("Host qofa!");
    return;
  }

  api.executeCommand("muteEveryone");
  }
  function toggleRaiseHand(){
  if(!api) return;

  myHandRaised = !myHandRaised;

  if(myHandRaised){
    api.executeCommand("toggleRaiseHand", true);
  }else{
    api.executeCommand("toggleRaiseHand", false);
  }
  }
  function showUserMenu(participant){
  let action;

  if(participant.raisedHand){
    action = prompt("1. Lower hand ✋\n2. Edit name\nLakkoofsa galchi:");
  }else{
    action = prompt("1. Raise hand ✋\n2. Edit name\nLakkoofsa galchi:");
  }

  if(action === "1"){
    toggleRaiseHand();
  }

  if(action === "2"){
    const newName = prompt("Maqaa haaraa galchi:");
    if(newName){
      api.executeCommand("displayName", newName);
    }
  }
  }
function shareScreen(){
  if(!api) return;

  api.executeCommand("toggleShareScreen");

  alert("Screen share jalqabde yoo permission si gaafate ALLOW jedhu cuqaasi");
      }
function openSettings(){ api.executeCommand("toggleSettings"); }
  let isRecording = false;

function toggleRecording(){
  const btn = document.getElementById("recordBtn");
  const indicator = document.getElementById("recordIndicator");

  if(!api) return;

  if(!isRecording){
    // ▶ START
    api.executeCommand("startRecording", {mode:"file"});
    isRecording = true;

    btn.innerText = "⏹ Stop";
    btn.classList.remove("record");
    btn.classList.add("stop");

    indicator.style.display = "block";

  }else{
    // ⏹ STOP
    api.executeCommand("stopRecording", {mode:"file"});
    isRecording = false;

    btn.innerText = "⏺ Start";
    btn.classList.remove("stop");
    btn.classList.add("record");

    indicator.style.display = "none";
  }
}
function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }
  function toggleParticipants(){
  const panel = document.getElementById("participantsPanel");

  if(panel.style.display === "none"){
    panel.style.display = "block";
    updateParticipants(); // yeroo banu refresh godha
  }else{
    panel.style.display = "none";
  }
  }
  function updateParticipants(){
  if(!api) return;

  const participantsList = document.getElementById("participantsList");
  const count = document.getElementById("participantsCount");

  participantsList.innerHTML = "";

  const list = api.getParticipantsInfo();

  count.innerText = list.length;

  list.forEach(p=>{
    const div = document.createElement("div");
    div.className = "participant";

    const name = p.displayName || "User";

    // 🎤 mic
    const micClass = p.audiomuted ? "off" : "";

    // 📷 video
    const videoClass = p.videoMuted ? "off" : "";

    // 👑 host
    const isHost = p.role === "moderator";

    div.innerHTML = `
      <div class="name">
        ${name}
        ${isHost ? '<span class="host">👑 Host</span>' : ''}
      </div>
      <div class="icons">
        <span class="${micClass}">🎤</span>
        <span class="${videoClass}">📷</span>
      </div>
    `;
if(raisedHands = {};[p.participantId]){
      displayname = "✋ " + displayname;
  api.addEventListener("raiseHandUpdated", (e)=>{
  raisedHands[e.id] = e.raisedHand;
  updateParticipants();
});
    }

    div.textContent = name;

    div.onclick = ()=>{
  alert("User: " + (p.displayName || "User"));
};
    div.textContent = p.displayName || p.formattedID || "Unknown";
    participantsList.appendChild(div);
  });
      }
  let micOn = false;
let videoOn = false;

function toggleMute(){
  if(!api) return;

  api.executeCommand("toggleAudio");
  micOn = !micOn;

  const btn = document.getElementById("micBtn");

  if(micOn){
    btn.innerHTML = "🎤";
    btn.classList.remove("off");
  }else{
    btn.innerHTML = "🎤";
    btn.classList.add("off"); // 🔴 sarara
  }
}

function toggleVideo(){
  if(!api) return;

  api.executeCommand("toggleVideo");
  videoOn = !videoOn;

  const btn = document.getElementById("videoBtn");

  if(videoOn){
    btn.innerHTML = "📷";
    btn.classList.remove("off");
  }else{
    btn.innerHTML = "📷";
    btn.classList.add("off"); // 🔴 sarara
  }
    }
let filterOn = false;

function toggleFilter(){
  const iframe = document.querySelector("#meet iframe");

  if(!iframe) return;

  if(filterOn){
    iframe.style.filter = "none";
    filterOn = false;
  }else{
    iframe.style.filter = "brightness(1.2) contrast(1.2) saturate(1.3)";
    filterOn = true;
  }
    }
// ROOM MODAL
const roomModal = document.getElementById("roomModal");
const roomBtn = document.getElementById("roomName");
const roomList = document.getElementById("roomList");
const roomSearch = document.getElementById("roomSearch");

const totalRooms = 1000;
let rooms = [];
for(let i=1;i<=totalRooms;i++){ rooms.push("Room "+i); }

function showRooms(){ roomModal.style.display="flex"; displayRooms(""); }
function displayRooms(filter){ roomList.innerHTML=""; rooms.filter(r=>r.toLowerCase().includes(filter.toLowerCase())).forEach(r=>{const div=document.createElement("div");div.className="room-item";div.innerText=r;div.onclick=()=> joinRoom(r);roomList.appendChild(div);}); }

roomBtn.addEventListener("click", showRooms);
roomSearch.addEventListener("input",()=>displayRooms(roomSearch.value));

function joinRoom(r){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="liveclass.html?room="+encodeURIComponent(r); }
function breakRoom(){ roomModal.style.display="none"; window.location.href="liveclass.html"; }
function leaveFromModal(){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="home.html"; }

</script>

</body>
</html>
