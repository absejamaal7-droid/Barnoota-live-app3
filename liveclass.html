<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#121212;
      color:white;
      font-family:Arial;
    }

    /* TOP BAR */
    #topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:50px;
      background:#1f1f1f;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
      z-index:10;
    }

    .room-btn{
      background:#2563eb;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #meet{
      margin-top:50px;
      height:calc(100vh - 110px);
      width:100%;
    }

    /* BOTTOM BAR */
    #bottombar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:60px;
      background:#1f1f1f;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      z-index:10;
      flex-wrap:wrap;
    }

    .control-btn{
      background:#333;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    .record{ background:#f59e0b; }
    .stop{ background:#10b981; }
    .leave{ background:#ef4444; }
    .intro{ background:#8b5cf6; }
    .breakroom{ background:#f97316; }

    /* Participants Modal */
    #participantsModal{
      display:none;
      position:fixed;
      top:50px;
      right:0;
      width:250px;
      max-height:400px;
      background:#1f1f1f;
      overflow-y:auto;
      padding:10px;
      border-radius:6px;
      z-index:20;
    }
    #participantsModal h4{
      margin:0 0 6px 0;
    }
    .participant{
      display:flex;
      justify-content:space-between;
      padding:4px;
      border-bottom:1px solid #333;
    }
  </style>
</head>

<body>

<!-- TOP -->
<div id="topbar">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- MEETING -->
<div id="meet"></div>

<!-- PARTICIPANTS MODAL -->
<div id="participantsModal">
  <h4>Participants</h4>
  <div id="participantsList"></div>
  <button style="margin-top:8px; padding:6px 12px;" onclick="closeParticipants()">Close</button>
</div>

<!-- CONTROLS -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn intro" onclick="showIntroduction()">📢 Introduction</button>
  <button class="control-btn breakroom" onclick="openBreakroom()">🔀 Breakroom</button>
  <button class="control-btn" onclick="toggleParticipants()">👥 Participants</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById("username").innerText = user.email;
    }else{
      window.location.href="index.html";
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const roomName = urlParams.get("room") || "Barnoota-Live";
  document.getElementById("roomName").innerText = roomName;

  const api = new JitsiMeetExternalAPI("meet.jit.si",{
    roomName: roomName,
    width:"100%",
    height:"100%",
    parentNode: document.querySelector("#meet"),
    configOverwrite: {
      prejoinPageEnabled: false,
      disableDeepLinking: true,
      startWithAudioMuted: false,
      startWithVideoMuted: false
    },
    interfaceConfigOverwrite: {
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
      HIDE_INVITE_MORE_HEADER: true,
      MOBILE_APP_PROMO: false,
      SHOW_JITSI_WATERMARK: false,
      SHOW_BRAND_WATERMARK: false,
      TOOLBAR_BUTTONS: ["microphone","camera","chat","desktop","settings","raisehand","hangup"]
    }
  });

  // Host password
  api.addEventListener("videoConferenceJoined", () => {
    const pass = prompt("Meeting password galchi (host qofatu kaa'a)");
    if(pass){
      api.executeCommand("password", pass);
    }
  });

  // Controls functions
  function toggleMute(){ api.executeCommand("toggleAudio"); }
  function toggleVideo(){ api.executeCommand("toggleVideo"); }
  function openChat(){ api.executeCommand("toggleChat"); }
  function shareScreen(){ api.executeCommand("toggleShareScreen"); }
  function openSettings(){ api.executeCommand("toggleSettings"); }
  function sendEmoji(){ api.executeCommand("sendTones"); }
  function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
  function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }
  function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }

  // Participants panel
  function toggleParticipants(){
    const modal=document.getElementById("participantsModal");
    modal.style.display=(modal.style.display==="none" || modal.style.display==="")?"block":"none";
  }
  function closeParticipants(){document.getElementById("participantsModal").style.display="none";}

  api.addEventListener("participantJoined", e=>{
    const container=document.getElementById("participantsList");
    const div=document.createElement("div");
    div.id=e.id; div.className="participant";
    div.innerHTML=`<span style="color:white;">${e.displayName||'Unknown'}</span>
      <button onclick="muteParticipant('${e.id}')">Mute</button>
      <button onclick="removeParticipant('${e.id}')">Remove</button>`;
    container.appendChild(div);
  });

  api.addEventListener("participantLeft", e=>{
    const div=document.getElementById(e.id);
    if(div) div.remove();
  });

  function muteParticipant(id){ api.executeCommand("muteParticipant", id); }
  function removeParticipant(id){ api.executeCommand("kickParticipant", id); }

  // 🔹 Breakroom
  function openBreakroom(){
    const confirmLeave = confirm("Breakroom: gara breakroom deebi'u barbaadda? OK=breakroom, Cancel=Leave Meeting");
    if(confirmLeave){
      window.location.href="liveclass.html"; // breakroom gara ol deebisuuf
    }else{
      leaveMeeting(); // guutumaan bahu
    }
  }

  // 🔹 Introduction
  function showIntroduction(){
    alert("📢 Introduction: Host jalqaba gabaasa kennu danda'a!");
  }

</script>

</body>
</html>
