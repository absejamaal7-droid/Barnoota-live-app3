<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#121212;
      color:white;
      font-family:Arial;
    }

    #topbar{
      position:fixed;
      top:0; left:0; right:0;
      height:50px;
      background:#1f1f1f;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
      z-index:10;
    }

    .room-container{
      position:relative;
      display:inline-block;
    }

    .room-btn{
      background:#2563eb;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    .room-dropdown{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      background:#1f1f1f;
      min-width:150px;
      max-height:300px;
      overflow-y:auto;
      border:1px solid #333;
      z-index:100;
    }

    .room-dropdown button{
      width:100%;
      padding:6px 10px;
      border:none;
      background:#1f1f1f;
      color:white;
      text-align:left;
      cursor:pointer;
    }

    .room-dropdown button:hover{
      background:#333;
    }

    #username{ margin-left:10px; }

    #meet{ margin-top:50px; height:calc(100vh - 110px); width:100%; }

    #bottombar{
      position:fixed; bottom:0; left:0; right:0;
      height:60px; background:#1f1f1f;
      display:flex; justify-content:center; align-items:center;
      gap:8px; z-index:10; flex-wrap:wrap;
    }

    .control-btn{
      background:#333; border:none; color:white;
      padding:6px 10px; border-radius:6px;
      cursor:pointer; font-size:12px;
    }

    .record{ background:#f59e0b; }
    .stop{ background:#10b981; }
    .leave{ background:#ef4444; }
  </style>
</head>

<body>

<div id="topbar">
  <div class="room-container">
    <button class="room-btn" onclick="toggleDropdown()">Room ▼</button>
    <div class="room-dropdown" id="roomDropdown"></div>
  </div>
  <div id="username">Loading...</div>
</div>

<div id="meet"></div>

<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById("username").innerText = user.email;
    }else{
      window.location.href="index.html";
    }
  });

  const dropdown = document.getElementById("roomDropdown");
  let api;
  let roomIndex = 1; // start room number
  const batch = 50; // how many rooms generate at once

  function loadRooms(){
    for(let i=0; i<batch; i++){
      const roomNumber = roomIndex++;
      const btn = document.createElement("button");
      btn.innerText = "Room " + roomNumber;
      btn.onclick = ()=>{ startMeeting("Room-" + roomNumber); toggleDropdown(false); };
      dropdown.appendChild(btn);
    }
  }

  dropdown.addEventListener('scroll', ()=>{
    if(dropdown.scrollTop + dropdown.clientHeight >= dropdown.scrollHeight){
      loadRooms();
    }
  });

  function toggleDropdown(forceClose){
    if(forceClose===false){ dropdown.style.display="none"; return; }
    dropdown.style.display = dropdown.style.display==="block"?"none":"block";
  }

  let roomName = new URLSearchParams(window.location.search).get("room") || "Barnoota-Live";

  function startMeeting(room){
    roomName = room;
    document.getElementById("meet").innerHTML="";
    api = new JitsiMeetExternalAPI("meet.jit.si",{
      roomName: roomName,
      width:"100%",
      height:"100%",
      parentNode: document.querySelector("#meet"),
      configOverwrite:{
        prejoinPageEnabled:false,
        disableDeepLinking:true,
        startWithAudioMuted:false,
        startWithVideoMuted:false
      },
      interfaceConfigOverwrite:{
        DISABLE_JOIN_LEAVE_NOTIFICATIONS:true,
        HIDE_INVITE_MORE_HEADER:true,
        MOBILE_APP_PROMO:false,
        SHOW_JITSI_WATERMARK:false,
        SHOW_BRAND_WATERMARK:false,
        TOOLBAR_BUTTONS:["microphone","camera","chat","desktop","settings","raisehand","hangup"]
      }
    });
  }

  // start default
  startMeeting(roomName);
  loadRooms(); // initial rooms

  // Controls
  function toggleMute(){ api.executeCommand("toggleAudio"); }
  function toggleVideo(){ api.executeCommand("toggleVideo"); }
  function openChat(){ api.executeCommand("toggleChat"); }
  function shareScreen(){ api.executeCommand("toggleShareScreen"); }
  function openSettings(){ api.executeCommand("toggleSettings"); }
  function sendEmoji(){ api.executeCommand("sendTones"); }
  function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
  function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }
  function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }

  // Host password
  api?.addEventListener("videoConferenceJoined", ()=>{
    const pass = prompt("Meeting password galchi (host qofatu kaa'a)");
    if(pass){
      api.executeCommand("password", pass);
    }
  });
</script>

</body>
</html>
