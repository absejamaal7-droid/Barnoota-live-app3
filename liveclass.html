<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body {margin:0; background:#121212; color:white; font-family:Arial;}
    #topbar{position:fixed; top:0; left:0; right:0; height:50px; background:#1f1f1f; display:flex; justify-content:space-between; align-items:center; padding:0 10px; z-index:10;}
    .room-btn{background:#2563eb; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer;}
    #meet{margin-top:50px; height:calc(100vh - 110px); width:100%;}
    #bottombar{position:fixed; bottom:0; left:0; right:0; height:60px; background:#1f1f1f; display:flex; justify-content:center; align-items:center; gap:8px; z-index:10; flex-wrap:wrap;}
    .control-btn{background:#333; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px;}
    .record{background:#f59e0b;} .stop{background:#10b981;} .leave{background:#ef4444;}
    #participantsPanel{display:none; position:fixed; right:0; top:50px; width:250px; height:calc(100vh - 50px); background:#222; overflow:auto; z-index:30; padding:10px;}
  </style>
</head>

<body>

<div id="topbar">
  <button class="room-btn">Room</button>
  <div id="username">Loading...</div>
  <button class="room-btn" onclick="goBack()">⬅ Back</button>
</div>

<div id="meet"></div>

<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">🎥</button>
  <button class="control-btn" onclick="toggleParticipants()">👥 Participants</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn" onclick="openChat()">💬</button>
    <button class="control-btn" onclick="shareScreen()">⬆️</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<div id="participantsPanel">
  <h3>Participants</h3>
  <div id="participantsList"></div>
</div>

<script>
// 🔥 Firebase haaraya kee
const firebaseConfig = {
  apiKey: "AIzaSyDAsIzBiQL2fxN4SWiSLAcoc3DpyLiP-j4",
  authDomain: "abseapp-b3706.firebaseapp.com",
  projectId: "abseapp-b3706",
  storageBucket: "abseapp-b3706.firebasestorage.app",
  messagingSenderId: "986026055368",
  appId: "1:986026055368:web:8ad2557f64c24d3c28b7fd",
  measurementId: "G-M57552RVD2"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("username").innerText=user.email;
  }else{
    window.location.href="index.html";
  }
});
let firstLoad = true;

auth.onAuthStateChanged(user=>{
  if(!user && !firstLoad){
    window.location.href="index.html";
  }
  firstLoad = false;
});
let api=null;
function startJitsi(roomName){
  const domain = "meet.jit.si";

  api = new JitsiMeetExternalAPI(domain, {
    roomName: roomName,
    width: "100%",
    height: "100%",
    parentNode: document.querySelector("#meet"),

    configOverwrite: {
      prejoinPageEnabled: false,
      disableInviteFunctions: true,
      hiddenPremeetingButtons: ['invite'],
      startWithAudioMuted: false,
      startWithVideoMuted: false
    },

    interfaceConfigOverwrite: {
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      TOOLBAR_BUTTONS: ["microphone","camera","chat","desktop","hangup"]
    }
  });
api.addEventListener("participantJoined", updateParticipants);
api.addEventListener("participantLeft", updateParticipants);
api.addEventListener("displayNameChange", updateParticipants);

  api.addEventListener("videoConferenceJoined", ()=>{
    api.executeCommand("displayName", auth.currentUser.email);
    updateParticipants();
  });
}

startJitsi("BarnootaLiveRoom");
history.pushState(null, null, location.href);
// Controls
function toggleMute(){if(api) api.executeCommand("toggleAudio");}
function toggleVideo(){if(api) api.executeCommand("toggleVideo");}
function openChat(){if(api) api.executeCommand("toggleChat");}
function shareScreen(){if(api) api.executeCommand("toggleShareScreen");}
function startRecording(){if(api) api.executeCommand("startRecording",{mode:"file"});}
function stopRecording(){if(api) api.executeCommand("stopRecording",{mode:"file"});}
function leaveMeeting(){
  if(api){
    api.executeCommand("hangup");
  }
  window.location.href = "home.html";
  }

// Participants
const participantsPanel=document.getElementById("participantsPanel");
const participantsList=document.getElementById("participantsList");

function toggleParticipants(){
  participantsPanel.style.display=
  participantsPanel.style.display==="none"?"block":"none";
}

function updateParticipants(){
  if(!api) return;
  api.getParticipantsInfo().then(list=>{
    participantsList.innerHTML="";
    list.forEach(p=>{
      const div=document.createElement("div");
      div.textContent = p.displayName || p.formattedID;
      participantsList.appendChild(div);
    });
  });
}function goBack(){
  window.location.href = "home.html";
}
</script>

</body>
</html>
