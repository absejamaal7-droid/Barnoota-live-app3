<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{margin:0;background:#121212;color:white;font-family:Arial;}
    #topbar{position:fixed;top:0;left:0;right:0;height:50px;background:#1f1f1f;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10;}
    .room-btn{background:#2563eb;border:none;color:white;padding:6px 10px;border-radius:6px;cursor:pointer;}
    #meet{margin-top:50px;height:calc(100vh - 110px);width:100%;}
    #bottombar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#1f1f1f;display:flex;justify-content:center;align-items:center;gap:8px;z-index:10;flex-wrap:wrap;}
    .control-btn{background:#333;border:none;color:white;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
    .record{background:#f59e0b;}
    .stop{background:#10b981;}
    .leave{background:#ef4444;}

    /* ROOM MODAL */
    #roomModal{position:fixed;top:50px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;padding:10px;z-index:20;}
    #roomSearch{padding:6px;margin-bottom:8px;border-radius:6px;border:none;font-size:14px;}
    #roomList{flex:1;overflow-y:auto;background:#1f1f1f;border-radius:6px;padding:5px;}
    .room-item{padding:8px;margin-bottom:4px;background:#333;border-radius:4px;cursor:pointer;}
    .room-item:hover{background:#444;}
    .modal-buttons{display:flex;justify-content:space-between;margin-top:8px;}
    .modal-btn{flex:1;padding:6px;margin:2px;border:none;border-radius:6px;cursor:pointer;font-size:14px;}
    .breakroom{background:#2563eb;color:white;}
    .leaveModal{background:#ef4444;color:white;}
    #participantsPanel{display:none;}
    #bottombar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#1c1c1c;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  z-index:10;
}

#bottombar button{
  background:#2b2b2b;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
}

#leaveBtn{
  background:#e11d48;
               }
  </style>
</head>
<body>

<div id="topbar">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>

<div id="meet"></div>

<div id="roomModal">
  <input type="text" id="roomSearch" placeholder="Search room...">
  <div id="roomList"></div>
  <div class="modal-buttons">
    <button class="modal-btn breakroom" onclick="breakRoom()">Breakroom</button>
    <button class="modal-btn leaveModal" onclick="leaveFromModal()">Leave</button>
  </div>
</div>
<select id="roomSelect" onchange="changeRoom()">
  <option value="Math Class">Math Class</option>
  <option value="English Class">English Class</option>
  <option value="Science Room">Science Room</option>
  <option value="Discussion Room">Discussion Room</option>
</select>
<div id="bottombar">
  <button class="control-btn" id="micBtn" onclick="toggleMute()">🎤 OFF</button>
  <button class="control-btn" id="videoBtn" onclick="toggleVideo()">📷 OFF</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥Share</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊 chat</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
  <button id="muteBtn" class="control-btn" onclick="muteAll()">🔇 Mute All</button>
</div>
<div id="participantsPanel">
  <h3>Participants</h3>
  <div id="participantsList"></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain: "absejamaal-772e3.firebaseapp.com",
  projectId: "absejamaal-772e3",
  storageBucket: "absejamaal-772e3.appspot.com",
  messagingSenderId: "522756860286",
  appId: "1:522756860286:web:d78a03faf3861347e26b2f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
  auth.onAuthStateChanged(user=>{
  if(user){
    const teacherEmail = "absejamaal7@gmail.com";

    if(user.email !== teacherEmail){
      document.getElementById("muteBtn").style.display = "none";
    }
  }
});

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("username").innerText = user.email;
  }else{
    window.location.href="index.html";
  }
});
let api = null;
const urlParams = new URLSearchParams(window.location.search);
const roomName = urlParams.get("room") || "Barnoota-Live";
document.getElementById("roomName").innerText = roomName;

function startJitsi(roomName){
  const domain = "meet.jit.si";

  api = new JitsiMeetExternalAPI(domain, {
    roomName: roomName,
    width: "100%",
    height: "100%",
    parentNode: document.querySelector("#meet"),
configOverwrite: {
  prejoinPageEnabled: false,
  disableDeepLinking: true,
  startWithAudioMuted: true,
  startWithVideoMuted: true
},

interfaceConfigOverwrite: {
  SHOW_JITSI_WATERMARK: false,
  SHOW_BRAND_WATERMARK: false,
  MOBILE_APP_PROMO: false,
  TOOLBAR_BUTTONS: [] // toolbar Jitsi dhoksa
   filmStripOnly: false
}
    }
  });

  // 🔥 yeroo namni seenu
  api.addEventListener("videoConferenceJoined", ()=>{
    const name = auth.currentUser.email.split("@")[0];
    api.executeCommand("displayName", name);

    updateParticipants();
  });

  // 👥 Participants update yeroo hunda
  api.addEventListener("participantJoined", updateParticipants);
  api.addEventListener("participantLeft", updateParticipants);
  api.addEventListener("displayNameChange", updateParticipants);
}

function muteAll(){
  if(!api) return;

  if(auth.currentUser.email !== teacherEmail){
    alert("Ati teacher miti!");
    return;
  }

  api.executeCommand("muteEveryone");
}
function updateParticipants(){
  if(!api) return;

  const participantsList = document.getElementById("participantsList");
  participantsList.innerHTML = "";

  const list = api.getParticipantsInfo();

  list.forEach(p=>{
    const div = document.createElement("div");

    div.style.padding = "6px";
    div.style.borderBottom = "1px solid gray";

    const name = p.displayName || "User";
    div.innerHTML = `<b>${name}</b>`;

    if(auth.currentUser.email === teacherEmail){

      const muteBtn = document.createElement("button");
      muteBtn.innerText = "Mute 🎤";
      muteBtn.onclick = ()=> muteUser(p.participantId);

      const videoBtn = document.createElement("button");
      videoBtn.innerText = "Stop 📷";
      videoBtn.onclick = ()=> stopVideo(p.participantId);

      const editBtn = document.createElement("button");
      editBtn.innerText = "Edit ✏️";
      editBtn.onclick = ()=> editName(p.participantId);

      div.appendChild(muteBtn);
      div.appendChild(videoBtn);
      div.appendChild(editBtn);
    }

    participantsList.appendChild(div);
  });
}
  function muteUser(id){
  if(role !== "host" && role !== "cohost") return;

  api.executeCommand("muteParticipant", id);
}

function stopVideo(id){
  if(role !== "host" && role !== "cohost") return;

  api.executeCommand("muteVideo", id);
}

function editName(id){
  if(role !== "host" && role !== "cohost") return;

  const newName = prompt("Maqaa haaraya galchi:");
  if(!newName) return;
  api.executeCommand("sendEndpointTextMessage", id, newName);
}
// CONTROLS
let micOn = false;

function toggleMute(){
  if(!api) return;

  api.executeCommand("toggleAudio");

  micOn = !micOn;

  const btn = document.getElementById("micBtn");
  btn.innerText = micOn ? "🎤 ON" : "🎤 OFF";
  }
let videoOn = false;

function toggleVideo(){
  if(!api) return;

  api.executeCommand("toggleVideo");

  videoOn = !videoOn;

  const btn = document.getElementById("videoBtn");
  btn.innerText = videoOn ? "📷 ON" : "📷 OFF";
  }
function openChat(){ api.executeCommand("toggleChat"); }
function shareScreen(){ api.executeCommand("toggleShareScreen"); }
function openSettings(){ api.executeCommand("toggleSettings"); }
function sendEmoji(){
  api.executeCommand("toggleReactionsMenu");
    }
function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }
function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }
// ROOM MODAL
const roomModal = document.getElementById("roomModal");
const roomBtn = document.getElementById("roomName");
const roomList = document.getElementById("roomList");
const roomSearch = document.getElementById("roomSearch");

const totalRooms = 1000;
let rooms = [];
for(let i=1;i<=totalRooms;i++){ rooms.push("Room "+i); }
function changeRoom(){
  const roomName = document.getElementById("roomSelect").value;

  if(api){
    api.dispose();
  }

  startJitsi(roomName);
    }
function showRooms(){ roomModal.style.display="flex"; displayRooms(""); }
function displayRooms(filter){ roomList.innerHTML=""; rooms.filter(r=>r.toLowerCase().includes(filter.toLowerCase())).forEach(r=>{const div=document.createElement("div");div.className="room-item";div.innerText=r;div.onclick=()=> joinRoom(r);roomList.appendChild(div);}); }

roomBtn.addEventListener("click", showRooms);
roomSearch.addEventListener("input",()=>displayRooms(roomSearch.value));

function joinRoom(r){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="liveclass.html?room="+encodeURIComponent(r); }
function breakRoom(){ roomModal.style.display="none"; window.location.href="liveclass.html"; }
function leaveFromModal(){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="home.html"; }
  startJitsi(roomName);
</script>

</body>
</html>
