<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body{margin:0;background:#121212;color:white;font-family:Arial;}
    #topbar{position:fixed;top:0;left:0;right:0;height:50px;background:#1f1f1f;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10;}
    .room-btn{background:#2563eb;border:none;color:white;padding:6px 10px;border-radius:6px;cursor:pointer;}
    #meet{margin-top:50px;height:calc(100vh - 110px);width:100%;}
    #bottombar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#1f1f1f;display:flex;justify-content:center;align-items:center;gap:8px;z-index:10;flex-wrap:wrap;}
    .control-btn{background:#333;border:none;color:white;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
    .record{background:#f59e0b;}
    .stop{background:#10b981;}
    .leave{background:#ef4444;}

    /* ROOM MODAL */
    #roomModal{position:fixed;top:50px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;padding:10px;z-index:20;}
    #roomSearch{padding:6px;margin-bottom:8px;border-radius:6px;border:none;font-size:14px;}
    #roomList{flex:1;overflow-y:auto;background:#1f1f1f;border-radius:6px;padding:5px;}
    .room-item{padding:8px;margin-bottom:4px;background:#333;border-radius:4px;cursor:pointer;}
    .room-item:hover{background:#444;}
    .modal-buttons{display:flex;justify-content:space-between;margin-top:8px;}
    .modal-btn{flex:1;padding:6px;margin:2px;border:none;border-radius:6px;cursor:pointer;font-size:14px;}
    .breakroom{background:#2563eb;color:white;}
    .leaveModal{background:#ef4444;color:white;}
    .off{
  color:red;
  text-decoration: line-through;
    }
    #chatInputSection{
  position:fixed;
  bottom:20;
  left:0;
  width:100%;
  display:flex;
  background:#111;
  padding:8px;
  gap:15px;
  z-index:10;
}

#chatInput{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  outline:none;
}

#chatInputSection button{
  padding:10px 15px;
  border-radius:20px;
  background:#2563eb;
  color:white;
  border:none;
}
    #participantsPanel{
  display:none;
  position:fixed;
  right:0;
  top:50px;
  width:280px;
  height:85%;
  background:#111;
  color:white;
  z-index:50;
  border-left:2px solid #333;
}

#participantsHeader{
  padding:10px;
  background:#1f1f1f;
  text-align:center;
  font-weight:bold;
}

.participant{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #333;
}

.name{
  flex:1;
}

.icons{
  display:flex;
  gap:6px;
}
.host{
  color:#22c55e;
  font-size:12px;
  margin-left:5px;
}

.speaking{
  background:#1e293b;
}
    #meet iframe{
  filter: brightness(1.1) contrast(1.1);
    }
    #meet{
  margin-top:50px;
  height:calc(100vh - 110px);
  width:100%;
      }
  </style>
</head>
<body>

<div id="topbar">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>
<div id="chatPanel" style="
  position:fixed;
  right:0;
  top:50px;
  width:300px;
  height:calc(100vh - 110px);
  background:#111;
  display:none;
  flex-direction:column;
  z-index:50;
  border-left:2px solid #333;
">

  <div style="padding:10px;background:#222;font-weight:bold;">
    Live Chat
  </div>

  <div id="chatMessages" style="
    flex:1;
    overflow:auto;
    padding:10px;
    font-size:14px;
  "></div>

  <div style="display:flex;padding:5px;border-top:1px solid #333;">
    <input id="chatInput" placeholder="Message..."
      style="flex:1;padding:6px;border:none;border-radius:4px;">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

  <div id="meet" style="width:100%; height:100vh;"></div>

<div id="roomModal">
  <input type="text" id="roomSearch" placeholder="Search room...">
  <div id="roomList"></div>
  <div class="modal-buttons">
    <button class="modal-btn breakroom" onclick="breakRoom()">Breakroom</button>
    <button class="modal-btn leaveModal" onclick="leaveFromModal()">Leave</button>
  </div>
</div>
<div id="participantsPanel" style="display:none; position:fixed; right:0; top:50px; width:250px; height:80%; background:#1f1f1f; overflow:auto; z-index:20;">
  <h3 style="text-align:center;">Participants</h3>
  <div id="participantsList"></div>
</div>
  <div id="participantsHeader">
  </div>

  <div id="bottombar">
  <button id="micBtn" class="control-btn" onclick="toggleMute()">🎤</button>
<button id="videoBtn" class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="toggleParticipants()">
  👥 <span id="participantsCount">0</span>
  </button>
    <button id="toggleFilter" class="control-btn" onclick="toggleFilter()">✨ Filter</button>
    <button class="control-btn" onclick="toggleLiveChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
 </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain: "absejamaal-772e3.firebaseapp.com",
  projectId: "absejamaal-772e3",
  storageBucket: "absejamaal-772e3.appspot.com",
  messagingSenderId: "522756860286",
  appId: "1:522756860286:web:d78a03faf3861347e26b2f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("username").innerText = user.email;
  }else{
    window.location.href="index.html";
  }
});
const db = firebase.firestore();
const urlParams = new URLSearchParams(window.location.search);
const roomName = urlParams.get("room") || "Barnoota-Live";
document.getElementById("roomName").innerText = roomName;

const api = new JitsiMeetExternalAPI("meet.jit.si",{
  roomName: roomName,
  width:"100%",
  height:"100%",
  parentNode: document.querySelector("#meet"),
  configOverwrite:
  {prejoinPageEnabled:false,
   disableDeepLinking:true,
   startWithAudioMuted:false,
   startWithVideoMuted:false,
   enableChat: true},
  
  interfaceConfigOverwrite:
  {DISABLE_JOIN_LEAVE_NOTIFICATIONS:true,
   HIDE_INVITE_MORE_HEADER:true,
   MOBILE_APP_PROMO:false,
   SHOW_JITSI_WATERMARK:false,
   SHOW_BRAND_WATERMARK:false,
   TOOLBAR_BUTTONS:["microphone","camera","chat","desktop","settings","raisehand","hangup",]}
});
api.addEventListener("dominantSpeakerChanged", (id)=>{
  const items = document.querySelectorAll(".participant");

  items.forEach(item=> item.classList.remove("speaking"));

  const list = api.getParticipantsInfo();

  list.forEach((p, index)=>{
    if(p.participantId === id){
      items[index].classList.add("speaking");
    }
  });
});
api.addEventListener("videoConferenceJoined", ()=>{
  if(api.isModerator()){
  const pass = prompt("Password kaa'i");
  if(pass){
    api.executeCommand("password", pass);
  }
  }

  
  const name = auth.currentUser.email.split("@")[0];
  api.executeCommand("displayName", name);

  // 🎤 Mic ON gochuu
  api.executeCommand("toggleAudio");

  // 🎥 Video ON
  api.executeCommand("toggleVideo");

  updateParticipants();
});
api.addEventListener("participantJoined", updateParticipants);
api.addEventListener("participantLeft", updateParticipants);
api.addEventListener("displayNameChange", updateParticipants);
api.addEventListener("audioMuteStatusChanged", updateParticipants);
api.addEventListener("videoMuteStatusChanged", updateParticipants);
// CONTROLS
  
function openChat(){
  const panel = document.getElementById("chatPanel");
  panel.style.display =
    panel.style.display === "none" ? "flex" : "none";
}
function sendMessage(){
  const input = document.getElementById("chatInput");
  const text = input.value;

  if(!text) return;

  const name = auth.currentUser.email.split("@")[0];

  db.collection("liveClassChat").add({
    user: name,
    text: text,
    date: new Date()
  });

  input.value = "";
}
db.collection("liveClassChat")
.orderBy("date")
.onSnapshot(snapshot=>{

  const box = document.getElementById("chatMessages");
  box.innerHTML = "";

  snapshot.forEach(doc=>{
    const m = doc.data();

    const div = document.createElement("div");

    div.style.marginBottom = "8px";

    div.innerHTML = `
      <b>${m.user}:</b> ${m.text}
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
});
function shareScreen(){ api.executeCommand("toggleShareScreen"); }
function openSettings(){ api.executeCommand("toggleSettings"); }
function sendEmoji(){ api.executeCommand("sendTones"); }
function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }
function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }
  function toggleParticipants(){
  const panel = document.getElementById("participantsPanel");

  if(panel.style.display === "none"){
    panel.style.display = "block";
    updateParticipants(); // yeroo banu refresh godha
  }else{
    panel.style.display = "none";
  }
  }
  function updateParticipants(){
  if(!api) return;

  const participantsList = document.getElementById("participantsList");
  const count = document.getElementById("participantsCount");

  participantsList.innerHTML = "";

  const list = api.getParticipantsInfo();

  count.innerText = list.length;

  list.forEach(p=>{
    const div = document.createElement("div");
    div.className = "participant";

    const name = p.displayName || "User";

    // 🎤 mic
    const micClass = p.audiomuted ? "off" : "";

    // 📷 video
    const videoClass = p.videoMuted ? "off" : "";

    // 👑 host
    const isHost = p.role === "moderator";

    div.innerHTML = `
      <div class="name">
        ${name}
        ${isHost ? '<span class="host">👑 Host</span>' : ''}
      </div>
      <div class="icons">
        <span class="${micClass}">🎤</span>
        <span class="${videoClass}">📷</span>
      </div>
    `;

    participantsList.appendChild(div);
  });
      }
  let micOn = false;
let videoOn = false;

function toggleMute(){
  if(!api) return;

  api.executeCommand("toggleAudio");
  micOn = !micOn;

  const btn = document.getElementById("micBtn");

  if(micOn){
    btn.innerHTML = "🎤";
    btn.classList.remove("off");
  }else{
    btn.innerHTML = "🎤";
    btn.classList.add("off"); // 🔴 sarara
  }
}

function toggleVideo(){
  if(!api) return;

  api.executeCommand("toggleVideo");
  videoOn = !videoOn;

  const btn = document.getElementById("videoBtn");

  if(videoOn){
    btn.innerHTML = "📷";
    btn.classList.remove("off");
  }else{
    btn.innerHTML = "📷";
    btn.classList.add("off"); // 🔴 sarara
  }
    }
let filterOn = false;

function toggleFilter(){
  const iframe = document.querySelector("#meet iframe");

  if(!iframe) return;

  if(filterOn){
    iframe.style.filter = "none";
    filterOn = false;
  }else{
    iframe.style.filter = "brightness(1.2) contrast(1.2) saturate(1.3)";
    filterOn = true;
  }
    }
// ROOM MODAL
const roomModal = document.getElementById("roomModal");
const roomBtn = document.getElementById("roomName");
const roomList = document.getElementById("roomList");
const roomSearch = document.getElementById("roomSearch");

const totalRooms = 1000;
let rooms = [];
for(let i=1;i<=totalRooms;i++){ rooms.push("Room "+i); }

function showRooms(){ roomModal.style.display="flex"; displayRooms(""); }
function displayRooms(filter){ roomList.innerHTML=""; rooms.filter(r=>r.toLowerCase().includes(filter.toLowerCase())).forEach(r=>{const div=document.createElement("div");div.className="room-item";div.innerText=r;div.onclick=()=> joinRoom(r);roomList.appendChild(div);}); }

roomBtn.addEventListener("click", showRooms);
roomSearch.addEventListener("input",()=>displayRooms(roomSearch.value));

function joinRoom(r){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="liveclass.html?room="+encodeURIComponent(r); }
function breakRoom(){ roomModal.style.display="none"; window.location.href="liveclass.html"; }
function leaveFromModal(){ roomModal.style.display="none"; api.executeCommand("hangup"); window.location.href="home.html"; }

</script>

</body>
</html>
