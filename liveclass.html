<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      background:#121212;
      color:white;
      font-family:Arial;
    }

    /* TOP BAR */
    #topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:50px;
      background:#1f1f1f;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
      z-index:10;
    }

    .room-btn{
      background:#2563eb;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #meet{
      margin-top:50px;
      height:calc(100vh - 110px);
      width:100%;
    }

    /* BOTTOM BAR */
    #bottombar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:60px;
      background:#1f1f1f;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      z-index:10;
      flex-wrap:wrap;
    }

    .control-btn{
      background:#333;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    .record{ background:#f59e0b; }
    .stop{ background:#10b981; }
    .leave{ background:#ef4444; }

    /* PARTICIPANTS PANEL */
    #participantsPanel{
      position:fixed;
      right:0;
      top:50px;
      width:250px;
      height:calc(100vh - 110px);
      background:#1f1f1f;
      overflow-y:auto;
      padding:10px;
      border-left:1px solid #333;
      z-index:11;
    }

    #participantsPanel h3{
      margin-top:0;
      font-size:16px;
      text-align:center;
    }

    .participant{
      background:#2d2d2d;
      margin:5px 0;
      padding:5px 8px;
      border-radius:4px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }

    .host-btn{
      background:#ef4444;
      color:white;
      border:none;
      border-radius:4px;
      padding:2px 5px;
      cursor:pointer;
      font-size:12px;
    }

    /* INTRO MODAL */
    #introModal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      color:white;
      font-size:16px;
      z-index:20;
    }

    #introModal input{
      padding:8px;
      margin:10px;
      width:250px;
      border-radius:5px;
      border:none;
    }

    #introModal button{
      padding:8px 12px;
      border:none;
      border-radius:5px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<!-- TOP -->
<div id="topbar">
  <button class="room-btn" id="roomName">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- PARTICIPANTS -->
<div id="participantsPanel">
  <h3>Participants</h3>
  <div id="participantsList"></div>
</div>

<!-- MEETING -->
<div id="meet"></div>

<!-- INTRO MODAL -->
<div id="introModal">
  <div>Welcome! Enter your display name:</div>
  <input type="text" id="displayNameInput" placeholder="Your name">
  <button onclick="joinRoom()">Join Room</button>
</div>

<!-- CONTROLS -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
    authDomain: "absejamaal-772e3.firebaseapp.com",
    projectId: "absejamaal-772e3",
    storageBucket: "absejamaal-772e3.appspot.com",
    messagingSenderId: "522756860286",
    appId: "1:522756860286:web:d78a03faf3861347e26b2f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById("username").innerText = user.email;
    }else{
      window.location.href="index.html";
    }
  });

  let api, displayName;

  function joinRoom(){
    displayName = document.getElementById("displayNameInput").value || "Anonymous";
    document.getElementById("introModal").style.display="none";

    const urlParams = new URLSearchParams(window.location.search);
    const roomName = urlParams.get("room") || "Barnoota-Live";
    document.getElementById("roomName").innerText = roomName;

    api = new JitsiMeetExternalAPI("meet.jit.si",{
      roomName: roomName,
      width:"100%",
      height:"100%",
      parentNode: document.querySelector("#meet"),
      configOverwrite: {
        prejoinPageEnabled:false,
        disableDeepLinking:true,
        startWithAudioMuted:false,
        startWithVideoMuted:false
      },
      interfaceConfigOverwrite:{
        DISABLE_JOIN_LEAVE_NOTIFICATIONS:true,
        HIDE_INVITE_MORE_HEADER:true,
        MOBILE_APP_PROMO:false,
        SHOW_JITSI_WATERMARK:false,
        SHOW_BRAND_WATERMARK:false,
        TOOLBAR_BUTTONS:["microphone","camera","chat","desktop","settings","raisehand","hangup"]
      },
      userInfo:{displayName: displayName}
    });

    // Host password
    api.addEventListener("videoConferenceJoined",()=>{
      const pass = prompt("Meeting password galchi (host qofatu kaa'a)");
      if(pass){ api.executeCommand("password", pass); }
      updateParticipantsList();
    });

    api.addEventListener("participantJoined",()=>{ updateParticipantsList(); });
    api.addEventListener("participantLeft",()=>{ updateParticipantsList(); });
  }

  function updateParticipantsList(){
    const participants = api.getParticipantsInfo();
    const container = document.getElementById("participantsList");
    container.innerHTML="";
    participants.forEach(p=>{
      const div = document.createElement("div");
      div.className="participant";
      div.innerText=p.displayName;
      // host control button only for host
      if(api.isOwner && p.id!==api.getMyUserId()){
        const btn = document.createElement("button");
        btn.className="host-btn";
        btn.innerText="Remove";
        btn.onclick = ()=>api.executeCommand("kickParticipant", p.id);
        div.appendChild(btn);
      }
      container.appendChild(div);
    });
  }

  // CONTROLS
  function toggleMute(){ api.executeCommand("toggleAudio"); }
  function toggleVideo(){ api.executeCommand("toggleVideo"); }
  function openChat(){ api.executeCommand("toggleChat"); }
  function shareScreen(){ api.executeCommand("toggleShareScreen"); }
  function openSettings(){ api.executeCommand("toggleSettings"); }
  function sendEmoji(){ api.executeCommand("sendTones"); }
  function startRecording(){ api.executeCommand("startRecording",{mode:"file"}); }
  function stopRecording(){ api.executeCommand("stopRecording",{mode:"file"}); }
  function leaveMeeting(){ api.executeCommand("hangup"); window.location.href="home.html"; }

</script>
</body>
</html>
