<!DOCTYPE html>
<html>
<head>
  <title>Live Classroom - Barnoota Live</title>

  <!-- Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body {margin:0; background:#121212; color:white; font-family:Arial;}
    #topbar{position:fixed; top:0; left:0; right:0; height:50px; background:#1f1f1f; display:flex; justify-content:space-between; align-items:center; padding:0 10px; z-index:10;}
    .room-btn{background:#2563eb; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer;}
    #meet{margin-top:50px; height:calc(100vh - 110px); width:100%;}
    #bottombar{position:fixed; bottom:0; left:0; right:0; height:60px; background:#1f1f1f; display:flex; justify-content:center; align-items:center; gap:8px; z-index:10; flex-wrap:wrap;}
    .control-btn{background:#333; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px;}
    .record{background:#f59e0b;} .stop{background:#10b981;} .leave{background:#ef4444;}

    /* ROOM LIST MODAL */
    #roomModal{display:none; position:fixed; top:50px; left:50%; transform:translateX(-50%); width:300px; max-height:400px; background:#1f1f1f; border-radius:8px; overflow:auto; z-index:20; padding:10px;}
    #roomModal input{width:100%; padding:6px; margin-bottom:8px; border-radius:4px; border:none;}
    .room-item{padding:6px; cursor:pointer; border-radius:4px; margin-bottom:4px; background:#333;}
    .room-item:hover{background:#555;}
    .breakroom-btn{background:#2563eb; color:white; padding:6px; border:none; border-radius:4px; margin-top:5px; cursor:pointer;}
    .leave-btn{background:#ef4444; color:white; padding:6px; border:none; border-radius:4px; margin-top:5px; cursor:pointer;}
  </style>
</head>

<body>

<div id="topbar">
  <button class="room-btn" id="roomBtn">Room</button>
  <div id="username">Loading...</div>
</div>

<!-- ROOM MODAL -->
<div id="roomModal">
  <input type="text" id="searchRoom" placeholder="Search room...">
  <div id="roomList"></div>
  <button class="breakroom-btn" onclick="goBreakroom()">Breakroom</button>
  <button class="leave-btn" onclick="leaveClass()">Leave</button>
</div>

<!-- Jitsi MEETING -->
<div id="meet"></div>

<!-- CONTROLS -->
<div id="bottombar">
  <button class="control-btn" onclick="toggleMute()">🎤</button>
  <button class="control-btn" onclick="toggleVideo()">📷</button>
  <button class="control-btn" onclick="openChat()">💬</button>
  <button class="control-btn" onclick="shareScreen()">🖥</button>
  <button class="control-btn" onclick="openSettings()">⚙️</button>
  <button class="control-btn" onclick="sendEmoji()">😊</button>
  <button class="control-btn record" onclick="startRecording()">⏺ Start</button>
  <button class="control-btn stop" onclick="stopRecording()">⏹ Stop</button>
  <button class="control-btn leave" onclick="leaveMeeting()">Leave</button>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyATogol0OIMwINVjEanhzJo2-mufYOcU_4",
  authDomain:"absejamaal-772e3.firebaseapp.com",
  projectId:"absejamaal-772e3",
  storageBucket:"absejamaal-772e3.appspot.com",
  messagingSenderId:"522756860286",
  appId:"1:522756860286:web:d78a03faf3861347e26b2f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){document.getElementById("username").innerText = user.email;}
  else{window.location.href="index.html";}
});

// ROOM BUTTON + MODAL
const roomBtn = document.getElementById("roomBtn");
const roomModal = document.getElementById("roomModal");
const roomList = document.getElementById("roomList");
const searchRoom = document.getElementById("searchRoom");

let rooms = [];
for(let i=1;i<=1000;i++){ rooms.push("Room "+i); }

function showRooms(){ roomModal.style.display="block"; renderRooms(); }
function hideRooms(){ roomModal.style.display="none"; }

roomBtn.addEventListener("click", showRooms);
searchRoom.addEventListener("input", renderRooms);

function renderRooms(){
  const query = searchRoom.value.toLowerCase();
  roomList.innerHTML="";
  rooms.filter(r=>r.toLowerCase().includes(query)).forEach(r=>{
    const div = document.createElement("div");
    div.className="room-item";
    div.textContent=r;
    div.onclick=()=>joinRoom(r);
    roomList.appendChild(div);
  });
}

function joinRoom(roomName){
  hideRooms();
  startJitsi(roomName);
}

// BREAKROOM / LEAVE
function goBreakroom(){ window.location.href="liveclass.html"; }
function leaveClass(){ window.location.href="home.html"; }

// JITSI MEETING
let api = null;
function startJitsi(roomName){
  const domain = "meet.jit.si";
  api = new JitsiMeetExternalAPI(domain,{
    roomName: roomName,
    width:"100%",
    height:"100%",
    parentNode: document.querySelector("#meet"),
    configOverwrite:{prejoinPageEnabled:false,disableDeepLinking:true,startWithAudioMuted:false,startWithVideoMuted:false},
    interfaceConfigOverwrite:{DISABLE_JOIN_LEAVE_NOTIFICATIONS:true,MOBILE_APP_PROMO:false,SHOW_JITSI_WATERMARK:false,SHOW_BRAND_WATERMARK:false,TOOLBAR_BUTTONS:["microphone","camera","chat","desktop","settings","raisehand","hangup"]}
  });
  api.addEventListener("videoConferenceJoined",()=>{ console.log("Joined "+roomName); });
}

// CONTROLS
function toggleMute(){ if(api) api.executeCommand("toggleAudio"); }
function toggleVideo(){ if(api) api.executeCommand("toggleVideo"); }
function openChat(){ if(api) api.executeCommand("toggleChat"); }
function shareScreen(){ if(api) api.executeCommand("toggleShareScreen"); }
function openSettings(){ if(api) api.executeCommand("toggleSettings"); }
function sendEmoji(){ if(api) api.executeCommand("sendTones"); }
function startRecording(){ if(api) api.executeCommand("startRecording",{mode:"file"}); }
function stopRecording(){ if(api) api.executeCommand("stopRecording",{mode:"file"}); }
function leaveMeeting(){ if(api) api.executeCommand("hangup"); window.location.href="home.html"; }
</script>

</body>
</html>
